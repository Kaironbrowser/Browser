<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookmarks — Kairon</title>
<style>
  /* ══════════════════════════════════════════════════════════
     KAIRON BOOKMARKS PAGE — Monochrome Dashboard
     Shares the exact internal-page design vocabulary as the
     Settings/History/Downloads pages (same tokens, same theme
     model, no gradients, no colored accents).
     ══════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    --bg-base:          #000000;
    --grid-line:        rgba(255,255,255,0.035);
    --grid-size:        36px;
    --bg-surface:       #131313;
    --bg-card:          #141414;
    --bg-hover:         rgba(255,255,255,0.065);
    --bg-active:        rgba(255,255,255,0.09);
    --border-0:         rgba(255,255,255,0.07);
    --border-1:         rgba(255,255,255,0.14);
    --border-focus:     rgba(255,255,255,0.35);
    --text-primary:     #eef0f8;
    --text-secondary:   #8b93b5;
    --text-tertiary:    #555e80;
    --accent:           #ffffff;

    --r-sm:   6px;
    --r-md:   10px;
    --r-lg:   14px;
    --r-full: 9999px;

    --dur-fast: 120ms;
    --dur-base: 200ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --font-ui:     'Geist', -apple-system, sans-serif;
    --font-serif:  Georgia, 'Times New Roman', serif;

    --glow-color: rgba(255, 255, 255, 0.15);
  }

  /* ── LIGHT THEME ──────────────────────────────────────────
     Monochrome light palette matching the shared Kairon theme
     vocabulary (settings/home/history). */
  :root[data-theme='light'] {
    color-scheme: light;
    --bg-base:          #f0f0f0;
    --grid-line:        rgba(0, 0, 0, 0.04);
    --bg-surface:       #ffffff;
    --bg-card:          #fafafa;
    --bg-hover:         rgba(0, 0, 0, 0.05);
    --bg-active:        rgba(0, 0, 0, 0.08);
    --border-0:         rgba(0, 0, 0, 0.08);
    --border-1:         rgba(0, 0, 0, 0.14);
    --border-focus:     rgba(0, 0, 0, 0.35);
    --text-primary:     #141414;
    --text-secondary:   #555555;
    --text-tertiary:    #777777;
    --accent:           #1a1a1a;
    --glow-color:       rgba(0, 0, 0, 0.08);
  }

  /* Theme flip: animate theme-dependent properties so Light↔Dark switches
     feel smooth instead of snapping. The flip class drops ~300ms after the
     switch, which also snaps any transition Chromium froze in a hidden or
     occluded window to the new theme values (no stale colors). */
  :root.theme-switching, :root.theme-switching *, :root.theme-switching *::before, :root.theme-switching *::after {
    transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, outline-color 220ms ease, box-shadow 220ms ease, fill 220ms ease, stroke 220ms ease !important;
    animation: none !important;
  }

  /* Internal-page navigation entrance (?transition=1 set by main when this
     page replaces another Kairon internal page). */
  html { transition: opacity 150ms ease-out, transform 150ms ease-out; }
  html.page-enter { opacity: 0.45; transform: translateY(5px); }
  html.page-enter * { animation: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  html, body {
    width: 100%; height: 100%;
    font-family: var(--font-ui);
    font-size: 13.5px;
    color: var(--text-primary);
    background-color: var(--bg-base);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
    background-position: -1px -1px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 32px 44px;
    animation: fadeIn 320ms var(--ease-out) both;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px) scaleY(0.96); } to { opacity: 1; transform: translateY(0) scaleY(1); } }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: var(--r-full); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

  /* ── HEADER ─────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-shrink: 0;
    animation: slideDown 280ms var(--ease-out) both;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #header-left h1 {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  #entry-count {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-1);
    background: var(--bg-surface);
  }

  #header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ── SEARCH ──────────────────────────────────────────── */
  #search-wrap {
    position: relative;
    width: 280px;
  }

  #search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }

  #search-input {
    width: 100%;
    height: 40px;
    padding: 0 14px 0 38px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-1);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    outline: none;
    transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  }
  #search-input::placeholder { color: var(--text-tertiary); }
  #search-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px var(--glow-color);
  }

  /* ── CONTENT ─────────────────────────────────────────── */
  #content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 8px;
  }

  /* ── BOOKMARK ITEM ───────────────────────────────────── */
  .bookmark-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
    animation: itemIn 200ms var(--ease-out) both;
    user-select: none;
  }
  .bookmark-item:hover { background: var(--bg-hover); }
  .bookmark-item:active { background: var(--bg-active); }

  .bookmark-item-favicon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--bg-surface);
    border: 1px solid var(--border-0);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bookmark-item-favicon img {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: block;
  }
  .bookmark-item-favicon .fallback-icon {
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
  }

  .bookmark-item-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bookmark-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.35;
  }

  .bookmark-item-url {
    font-size: 12px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bookmark-item-action-btn {
    width: 30px;
    height: 30px;
    border-radius: var(--r-sm);
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .bookmark-item-action-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .bookmark-item-action-btn.delete:hover {
    background: var(--text-primary);
    color: var(--bg-base);
  }

  /* ── EMPTY STATE ─────────────────────────────────────── */
  #empty-state {
    display: flex;
    align-items: center;
    gap: 36px;
    text-align: left;
    padding: 40px 44px;
    background: var(--bg-card);
    border: 1px solid var(--border-0);
    border-radius: var(--r-lg);
    animation: fadeIn 400ms var(--ease-out) both;
  }

  #empty-illustration { flex-shrink: 0; }

  #empty-state-text h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  #empty-state-text p {
    font-size: 13px;
    color: var(--text-secondary);
    max-width: 360px;
    line-height: 1.55;
    margin-bottom: 6px;
  }

  #empty-state-text p.tip {
    color: var(--text-tertiary);
    font-size: 12px;
  }
</style>
</head>
<body>
<script>
  // Apply the persisted theme before first paint: the main process passes the
  // current FeatureStore value as ?theme= when loading this page. Live changes
  // arrive via settings-updated (see the sync script at the end of the body).
  try {
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
  } catch (e) {}
</script>
<script>
  // Internal-page navigation entrance: main adds ?transition=1 when this page
  // replaces another Kairon internal page. The hidden state is applied before
  // first paint (no flash), then a double-rAF releases the fade/rise so the
  // transition starts from the painted frame. First loads have no
  // ?transition= and render instantly.
  (function () {
    try {
      if (new URLSearchParams(location.search).get('transition') !== '1') return;
      var root = document.documentElement;
      var released = false;
      function release() {
        if (released) return;
        released = true;
        root.classList.remove('page-enter');
      }
      root.classList.add('page-enter');
      requestAnimationFrame(function () {
        requestAnimationFrame(release);
      });
      // Safety net: if rAF is throttled (e.g. the window is occluded right
      // after navigation) never leave the page stuck at the 45% start state.
      setTimeout(release, 350);
    } catch (e) {}
  })();
</script>

  <!-- ══ HEADER ═══════════════════════════════════════════ -->
  <div id="header">
    <div id="header-left">
      <h1>Bookmarks</h1>
      <span id="entry-count">0 saved</span>
    </div>
    <div id="header-actions">
      <div id="search-wrap">
        <svg width="15" height="15" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search bookmarks…" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- ══ CONTENT ══════════════════════════════════════════ -->
  <div id="content"></div>

<script>
(function() {
  'use strict';

  const { kairon } = window;

  // ── DOM REFS ─────────────────────────────────────────────
  const content     = document.getElementById('content');
  const searchInput = document.getElementById('search-input');
  const entryCount  = document.getElementById('entry-count');

  // ── STATE ────────────────────────────────────────────────
  let allBookmarks = [];
  let searchQuery = '';

  // ── HELPERS ──────────────────────────────────────────────
  function sanitizeText(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function formatUrl(url) {
    try {
      const u = new URL(url);
      return u.hostname + (u.pathname.length > 1 ? u.pathname.substring(0, 60) + (u.pathname.length > 60 ? '…' : '') : '');
    } catch {
      return url;
    }
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const sameYear = date.getFullYear() === now.getFullYear();
    return date.toLocaleDateString([], { month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
  }

  // ── RENDER ──────────────────────────────────────────────
  function render() {
    const needle = searchQuery.trim().toLowerCase();
    const filtered = needle
      ? allBookmarks.filter(b => b.title.toLowerCase().includes(needle) || b.url.toLowerCase().includes(needle))
      : allBookmarks;

    entryCount.textContent = allBookmarks.length + ' saved';

    if (allBookmarks.length === 0) {
      content.innerHTML = `
        <div id="empty-state">
          <div id="empty-illustration">
            <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
              <ellipse cx="60" cy="88" rx="34" ry="5" fill="currentColor" opacity="0.06"/>
              <path d="M28 22 L92 22 L92 80 L60 64 L28 80 Z" fill="var(--bg-surface)" stroke="var(--border-1)" stroke-width="1.2"/>
              <path d="M28 22 L60 38 L92 22" stroke="var(--border-1)" stroke-width="1.2"/>
            </svg>
          </div>
          <div id="empty-state-text">
            <h3>${needle ? 'No matching bookmarks' : 'No bookmarks yet'}</h3>
            <p>${needle ? 'Try a different search term.' : 'Pages you bookmark will appear here, ready to open again in one click.'}</p>
            ${needle ? '' : '<p class="tip">Tip: Press Ctrl+D on any page to bookmark it. Press it again to remove the bookmark.</p>'}
          </div>
        </div>`;
      return;
    }

    if (filtered.length === 0) {
      content.innerHTML = `
        <div id="empty-state">
          <div id="empty-illustration">
            <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
              <ellipse cx="60" cy="88" rx="34" ry="5" fill="currentColor" opacity="0.06"/>
              <path d="M28 22 L92 22 L92 80 L60 64 L28 80 Z" fill="var(--bg-surface)" stroke="var(--border-1)" stroke-width="1.2"/>
              <path d="M28 22 L60 38 L92 22" stroke="var(--border-1)" stroke-width="1.2"/>
            </svg>
          </div>
          <div id="empty-state-text">
            <h3>No matching bookmarks</h3>
            <p>Try a different search term.</p>
          </div>
        </div>`;
      return;
    }

    let html = '';
    let delay = 0;
    for (const bookmark of filtered) {
      const title = bookmark.title || bookmark.url;
      const dispUrl = formatUrl(bookmark.url);

      html += '<div class="bookmark-item" data-url="' + bookmark.url.replace(/"/g, '&quot;') + '" data-id="' + bookmark.id + '" style="animation-delay:' + delay + 'ms">'
        + '<div class="bookmark-item-favicon">'
        + (bookmark.favicon
          ? '<img src="' + bookmark.favicon.replace(/"/g, '&quot;') + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
          : '')
        + '<div class="fallback-icon"' + (bookmark.favicon ? ' style="display:none"' : '') + '>'
        + '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 8h13M8 1.5C6 4 6 12 8 14.5M8 1.5c2 2.5 2 10.5 0 13" stroke="currentColor" stroke-width="1.2"/></svg>'
        + '</div>'
        + '</div>'
        + '<div class="bookmark-item-body">'
        + '<div class="bookmark-item-title">' + sanitizeText(title) + '</div>'
        + '<div class="bookmark-item-url">' + sanitizeText(dispUrl) + '</div>'
        + '</div>'
        + '<span style="font-size:11px;color:var(--text-tertiary);flex-shrink:0;white-space:nowrap">' + formatDate(bookmark.createdAt) + '</span>'
        + '<button class="bookmark-item-action-btn delete" data-id="' + bookmark.id + '" title="Remove bookmark" aria-label="Remove bookmark">'
        + '<svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M4.5 3V2a1 1 0 011-1h1a1 1 0 011 1v1M5 5.5v3M7 5.5v3M9.5 3l-.5 6.5a1 1 0 01-1 .9H4a1 1 0 01-1-.9L2.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '</button>'
        + '</div>';
      delay = Math.min(delay + 15, 150);
    }

    content.innerHTML = html;

    document.querySelectorAll('.bookmark-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.bookmark-item-action-btn')) return;
        const url = el.dataset.url;
        if (url && kairon) kairon.openBookmark(url);
      });
    });

    document.querySelectorAll('.bookmark-item-action-btn.delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id, 10);
        if (!isNaN(id)) deleteBookmark(id);
      });
    });
  }

  // ── DELETE ───────────────────────────────────────────────
  function deleteBookmark(id) {
    kairon.deleteBookmark(id).then(() => {
      allBookmarks = allBookmarks.filter(b => b.id !== id);
      render();
    }).catch(err => {
      console.error('[bookmarks] delete failed:', err);
    });
  }

  // ── LOAD ─────────────────────────────────────────────────
  async function loadBookmarks() {
    try {
      allBookmarks = await kairon.getBookmarks();
    } catch (err) {
      console.error('[bookmarks] load failed:', err);
      allBookmarks = [];
    }
    render();
  }

  // Live updates: main pushes the full list whenever bookmarks change
  // anywhere (Ctrl+D in another tab, etc.).
  try {
    kairon.onBookmarksUpdated((list) => {
      allBookmarks = Array.isArray(list) ? list : [];
      render();
    });
  } catch (e) {}

  // ── SEARCH DEBOUNCE ──────────────────────────────────────
  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = searchInput.value;
      render();
    }, 150);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchInput.value) {
      searchInput.value = '';
      searchQuery = '';
      render();
    }
  });

  // ── INIT ─────────────────────────────────────────────────
  loadBookmarks();
})();
</script>

<script>
  // ── GLOBAL THEME LIVE SYNC ───────────────────────────────
  // The persisted Theme Mode (FeatureStore) is the single source of truth.
  // Main re-pushes the full snapshot to every Kairon-owned internal page on
  // change; flip instantly and re-enable transitions after one frame.
  (function () {
    function applyTheme(mode) {
      var theme = mode === 'light' ? 'light' : 'dark';
      var root = document.documentElement;
      if (root.dataset.theme === theme) return;
      root.classList.add('theme-switching');
      void root.offsetHeight; // recalc so the transition rule is active before values change
      root.dataset.theme = theme;
      setTimeout(function () { root.classList.remove('theme-switching'); }, 300);
    }
    try {
      window.kairon.onSettingsUpdated(function (snapshot) {
        var mode = snapshot && snapshot.state && snapshot.state.themeSystem && snapshot.state.themeSystem.settings && snapshot.state.themeSystem.settings.mode;
        if (mode) applyTheme(mode);
      });
    } catch (e) {}
  })();
</script>
</body>
</html>
