<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History — Kairon</title>
<style>
  /* ══════════════════════════════════════════════════════════
     KAIRON HISTORY PAGE — Monochrome Dashboard
     ══════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    --bg-base:          #000000;
    --grid-line:        rgba(255,255,255,0.035);
    --grid-size:        36px;
    --bg-surface:       #131313;
    --bg-card:          #141414;
    --bg-hover:         rgba(255,255,255,0.065);
    --bg-active:        rgba(255,255,255,0.09);
    --border-0:         rgba(255,255,255,0.07);
    --border-1:         rgba(255,255,255,0.14);
    --border-focus:     rgba(255,255,255,0.35);
    --text-primary:     #eef0f8;
    --text-secondary:   #8b93b5;
    --text-tertiary:    #555e80;
    --accent:           #ffffff;

    --r-sm:   6px;
    --r-md:   10px;
    --r-lg:   14px;
    --r-xl:   18px;
    --r-full: 9999px;

    --dur-fast: 120ms;
    --dur-base: 200ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --font-ui:     'Geist', -apple-system, sans-serif;
    --font-serif:  Georgia, 'Times New Roman', serif;
    --font-mono:   'Geist Mono', 'SF Mono', monospace;

    --glow-color: rgba(255, 255, 255, 0.15);
    --overlay-bg:       rgba(0, 0, 0, 0.7);
    --modal-bg:         #121212;
    --modal-shadow:     0 16px 48px rgba(0, 0, 0, 0.6);
    --confirm-hover-bg: #ffffff;
    --illustration-hex: #141414;
    --illustration-ink: #ffffff;
  }

  /* ── LIGHT THEME ──────────────────────────────────────────
     Monochrome light palette matching the shared Kairon theme vocabulary
     (settings/home/history): off-white backgrounds, dark ink text, subtle
     gray borders. Applied via data-theme on <html> (set before first paint
     from the ?theme= query and live-synced from the FeatureStore). */
  :root[data-theme='light'] {
    color-scheme: light;
    --bg-base:          #f0f0f0;
    --grid-line:        rgba(0, 0, 0, 0.04);
    --bg-surface:       #ffffff;
    --bg-card:          #fafafa;
    --bg-hover:         rgba(0, 0, 0, 0.05);
    --bg-active:        rgba(0, 0, 0, 0.08);
    --border-0:         rgba(0, 0, 0, 0.08);
    --border-1:         rgba(0, 0, 0, 0.14);
    --border-focus:     rgba(0, 0, 0, 0.35);
    --text-primary:     #141414;
    --text-secondary:   #555555;
    --text-tertiary:    #777777;
    --accent:           #1a1a1a;
    --glow-color:       rgba(0, 0, 0, 0.08);
    --overlay-bg:       rgba(0, 0, 0, 0.35);
    --modal-bg:         #ffffff;
    --modal-shadow:     0 16px 48px rgba(0, 0, 0, 0.18);
    --confirm-hover-bg: #1a1a1a;
    --illustration-hex: #e8e8e8;
    --illustration-ink: #1a1a1a;
  }

  /* Empty-state illustration re-skin in light mode: the SVG uses presentation
     attributes, so light overrides target them by attribute — dark mode is
     untouched (byte-for-byte identical). */
  :root[data-theme='light'] #empty-illustration svg path[fill="#141414"] { fill: var(--illustration-hex); }
  :root[data-theme='light'] #empty-illustration svg circle[fill="#ffffff"],
  :root[data-theme='light'] #empty-illustration svg ellipse[fill="#ffffff"] { fill: var(--illustration-ink); }

  /* Theme flip: suspend transitions/animations for one frame so every surface
     re-skins instantly (Chromium freezes transitions in hidden/occluded
     windows, which would otherwise leave stale colors). */
  /* Theme flip: animate theme-dependent properties so Light↔Dark switches
     feel smooth instead of snapping. The flip class drops ~300ms after the
     switch, which also snaps any transition Chromium froze in a hidden or
     occluded window to the new theme values (no stale colors). */
  :root.theme-switching, :root.theme-switching *, :root.theme-switching *::before, :root.theme-switching *::after {
    transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, outline-color 220ms ease, box-shadow 220ms ease, fill 220ms ease, stroke 220ms ease !important;
    animation: none !important;
  }

  /* Internal-page navigation entrance (?transition=1 set by main when this
     page replaces another Kairon internal page): fades in with a slight rise.
     The hidden state applies before first paint; a double-rAF releases it.
     First loads render instantly — no class, no animation. Element-level
     entrance animations are suppressed during the entrance so nothing plays
     twice. */
  html { transition: opacity 150ms ease-out, transform 150ms ease-out; }
  html.page-enter { opacity: 0.45; transform: translateY(5px); }
  html.page-enter * { animation: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  html, body {
    width: 100%; height: 100%;
    font-family: var(--font-ui);
    font-size: 13.5px;
    color: var(--text-primary);
    background-color: var(--bg-base);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
    background-position: -1px -1px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 32px 44px;
    animation: fadeIn 320ms var(--ease-out) both;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px) scaleY(0.96); } to { opacity: 1; transform: translateY(0) scaleY(1); } }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes floatGlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: var(--r-full); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

  /* ── HEADER ─────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-shrink: 0;
    animation: slideDown 280ms var(--ease-out) both;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #header-left h1 {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }

  #entry-count {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-1);
    background: var(--bg-surface);
  }

  #header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ── SEARCH ──────────────────────────────────────────── */
  #search-wrap {
    position: relative;
    width: 280px;
  }

  #search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }

  #search-input {
    width: 100%;
    height: 40px;
    padding: 0 14px 0 38px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-1);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    outline: none;
    transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  }
  #search-input::placeholder { color: var(--text-tertiary); }
  #search-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px var(--glow-color);
  }

  /* ── BUTTONS ────────────────────────────────────── */
  .btn {
    height: 40px;
    padding: 0 18px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-1);
    background: var(--bg-surface);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .btn:hover {
    border-color: var(--border-focus);
    background: var(--bg-hover);
  }
  .btn:active { transform: scale(0.96); }

  .btn-danger:hover {
    background: var(--text-primary);
    border-color: var(--text-primary);
    color: var(--bg-base);
  }

  /* ── TOP ROW: Most Visited + Stats ───────────────────── */
  #top-row {
    display: flex;
    gap: 16px;
    margin-bottom: 26px;
    flex-shrink: 0;
  }

  /* Most Visited */
  #most-visited {
    flex: 0 0 420px;
    background: var(--bg-card);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border: 1px solid var(--border-0);
  }

  #most-visited-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #most-visited-header h2 {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
  }

  #most-visited-header svg { color: var(--text-tertiary); cursor: pointer; }

  #most-visited-grid {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    flex: 1;
    align-items: flex-start;
  }

  .most-visited-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    width: 56px;
    text-align: center;
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .most-visited-item:hover { transform: translateY(-3px); }

  .most-visited-item-favicon {
    width: 44px;
    height: 44px;
    border-radius: var(--r-full);
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid var(--border-0);
  }
  .most-visited-item-favicon img {
    width: 26px;
    height: 26px;
    border-radius: 5px;
  }

  .most-visited-item-title {
    font-size: 10.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .most-visited-item-visits {
    font-size: 9.5px;
    color: var(--text-tertiary);
  }

  /* Stats Grid */
  #stats-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .stat-card {
    background: var(--bg-card);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--border-0);
  }

  .stat-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
  }

  .stat-card-header svg {
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
  }

  .stat-card-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .stat-card-trend {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* ── CONTENT ─────────────────────────────────────────── */
  #content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 8px;
  }

  /* ── GROUP ───────────────────────────────────────────── */
  .group { margin-bottom: 18px; }

  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .group-header h2 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .group-header .group-count {
    font-size: 11.5px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .group-header .group-line {
    flex: 1;
    height: 1px;
    background: var(--border-0);
  }

  .group-header .toggle-icon {
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
    transition: transform var(--dur-base) var(--ease-out);
    flex-shrink: 0;
  }
  .group-header.collapsed .toggle-icon { transform: rotate(-90deg); }

  .group-content { display: block; }
  .group-content.collapsed { display: none; }

  /* ── HISTORY ITEM ────────────────────────────────────── */
  .history-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
    animation: itemIn 200ms var(--ease-out) both;
    position: relative;
    user-select: none;
  }
  .history-item:hover { background: var(--bg-hover); }
  .history-item:active { background: var(--bg-active); }

  .history-item-favicon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--bg-surface);
    border: 1px solid var(--border-0);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .history-item-favicon img {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: block;
  }
  .history-item-favicon .fallback-icon {
    width: 16px;
    height: 16px;
    color: var(--text-tertiary);
  }

  .history-item-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.35;
  }

  .history-item-url {
    font-size: 12px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .history-item-time {
    white-space: nowrap;
    width: 92px;
    text-align: right;
    color: var(--text-tertiary);
  }

  .history-item-visits {
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: var(--r-full);
    border: 1px solid var(--border-0);
    background: var(--bg-surface);
    color: var(--text-secondary);
  }

  .history-item-device {
    flex-shrink: 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-tertiary);
    width: 96px;
  }
  .history-item-device svg { width: 14px; height: 14px; flex-shrink: 0; }

  .history-item-action-btn {
    width: 30px;
    height: 30px;
    border-radius: var(--r-sm);
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .history-item-action-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .history-item-action-btn.bookmark.active {
    color: var(--text-primary);
  }
  .history-item-action-btn.delete:hover {
    background: var(--text-primary);
    color: var(--bg-base);
  }

  /* ── EMPTY STATE ─────────────────────────────────────── */
  #empty-state {
    display: flex;
    align-items: center;
    gap: 36px;
    text-align: left;
    padding: 40px 44px;
    background: var(--bg-card);
    border: 1px solid var(--border-0);
    border-radius: var(--r-lg);
    animation: fadeIn 400ms var(--ease-out) both;
  }

  #empty-illustration { flex-shrink: 0; }

  #empty-state-text h3 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  #empty-state-text p {
    font-size: 13px;
    color: var(--text-secondary);
    max-width: 360px;
    line-height: 1.55;
    margin-bottom: 6px;
  }

  #empty-state-text p.tip {
    color: var(--text-tertiary);
    font-size: 12px;
  }

  /* ── MODAL (confirmation dialog) ─────────────────────── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    place-items: center;
    background: var(--overlay-bg);
    backdrop-filter: blur(6px);
    animation: fadeIn 160ms var(--ease-out) both;
  }
  #modal-overlay.active { display: grid; }

  #modal-dialog {
    width: min(380px, 90%);
    padding: 28px 24px 20px;
    border-radius: var(--r-lg);
    border: 1px solid var(--border-1);
    background: var(--modal-bg);
    box-shadow: var(--modal-shadow);
    animation: slideDown 200ms var(--ease-out) both;
  }

  #modal-dialog h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  #modal-dialog p {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  #modal-dialog .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  #modal-dialog .modal-actions button {
    height: 34px;
    padding: 0 16px;
    border-radius: var(--r-md);
    border: 1px solid var(--border-1);
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-out);
  }

  #modal-dialog .btn-cancel {
    background: transparent;
    color: var(--text-secondary);
  }
  #modal-dialog .btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }

  #modal-dialog .btn-confirm {
    background: var(--text-primary);
    border-color: var(--text-primary);
    color: var(--bg-base);
    font-weight: 600;
  }
  #modal-dialog .btn-confirm:hover {
    background: var(--confirm-hover-bg);
    border-color: var(--confirm-hover-bg);
  }
</style>
</head>
<body>
<script>
  // Apply the persisted theme before first paint: the main process passes the
  // current FeatureStore value as ?theme= when loading this page. Live changes
  // arrive via settings-updated (see the sync script at the end of the body).
  try {
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
  } catch (e) {}
</script>
<script>
  // Internal-page navigation entrance: main adds ?transition=1 when this page
  // replaces another Kairon internal page. The hidden state is applied before
  // first paint (no flash), then a double-rAF releases the fade/rise so the
  // transition starts from the painted frame. First loads have no
  // ?transition= and render instantly.
  (function () {
    try {
      if (new URLSearchParams(location.search).get('transition') !== '1') return;
      var root = document.documentElement;
      var released = false;
      function release() {
        if (released) return;
        released = true;
        root.classList.remove('page-enter');
      }
      root.classList.add('page-enter');
      requestAnimationFrame(function () {
        requestAnimationFrame(release);
      });
      // Safety net: if rAF is throttled (e.g. the window is occluded right
      // after navigation) never leave the page stuck at the 45% start state.
      setTimeout(release, 350);
    } catch (e) {}
  })();
</script>

  <!-- ══ HEADER ═══════════════════════════════════════════ -->
  <div id="header">
    <div id="header-left">
      <h1>History</h1>
      <span id="entry-count">0 entries</span>
    </div>
    <div id="header-actions">
      <div id="search-wrap">
        <svg width="15" height="15" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search history…" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn btn-danger" id="btn-clear-history">
        <svg width="14" height="14" viewBox="0 0 13 13" fill="none">
          <path d="M2 3.5h9M4.5 3.5V2.5a1 1 0 011-1h2a1 1 0 011 1v1M5.5 6v4M7.5 6v4M10.5 3.5l-.6 7.2a1 1 0 01-1 .8H4.1a1 1 0 01-1-.8L2.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Clear History
      </button>
    </div>
  </div>

  <!-- ══ TOP ROW ══════════════════════════════════════════ -->
  <div id="top-row">
    <div id="most-visited">
      <div id="most-visited-header">
        <h2>Most Visited Today</h2>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div id="most-visited-grid"></div>
    </div>
    <div id="stats-grid"></div>
  </div>

  <!-- ══ CONTENT ══════════════════════════════════════════ -->
  <div id="content"></div>

  <!-- ══ MODAL ════════════════════════════════════════════ -->
  <div id="modal-overlay">
    <div id="modal-dialog">
      <h3>Clear all history?</h3>
      <p>This action cannot be undone. All your browsing history will be permanently removed.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-modal-cancel">Cancel</button>
        <button class="btn-confirm" id="btn-modal-confirm">Clear History</button>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  const { kairon } = window;

  // ── DOM REFS ─────────────────────────────────────────────
  const content           = document.getElementById('content');
  const searchInput       = document.getElementById('search-input');
  const btnClear          = document.getElementById('btn-clear-history');
  const entryCount        = document.getElementById('entry-count');
  const modalOverlay      = document.getElementById('modal-overlay');
  const btnModalCancel    = document.getElementById('btn-modal-cancel');
  const btnModalConfirm   = document.getElementById('btn-modal-confirm');
  const mostVisitedGrid   = document.getElementById('most-visited-grid');
  const statsGrid         = document.getElementById('stats-grid');

  // ── STATE ────────────────────────────────────────────────
  let allEntries = [];
  let searchQuery = '';
  let bookmarked = new Set(); // decorative, per-session only

  const GROUP_LABELS = ['TODAY', 'YESTERDAY', 'THIS WEEK', 'EARLIER THIS MONTH', 'OLDER'];

  const DEVICE_ICON = '<svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 14h5M8 11v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  // ── HELPERS ──────────────────────────────────────────────
  function getGroupKey(timestamp) {
    const now = new Date();
    const date = new Date(timestamp);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const weekAgo = new Date(today);
    weekAgo.setDate(weekAgo.getDate() - 7);
    const monthAgo = new Date(today);
    monthAgo.setDate(monthAgo.getDate() - 30);

    const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());

    if (dateOnly.getTime() === today.getTime()) return 0;
    if (dateOnly.getTime() === yesterday.getTime()) return 1;
    if (date >= weekAgo) return 2;
    if (date >= monthAgo) return 3;
    return 4;
  }

  function formatTime(timestamp, groupIdx) {
    const date = new Date(timestamp);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);

    const clock = date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    if (groupIdx === 0) {
      if (diffMins < 1) return 'just now';
      return clock;
    }
    if (groupIdx === 1) return 'Yesterday, ' + clock;

    const opts = { month: 'short', day: 'numeric' };
    if (date.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return date.toLocaleDateString([], opts);
  }

  function formatUrl(url) {
    try {
      const u = new URL(url);
      return u.hostname + (u.pathname.length > 1 ? u.pathname.substring(0, 60) + (u.pathname.length > 60 ? '…' : '') : '');
    } catch {
      return url;
    }
  }

  function getFaviconUrl(url) {
    try {
      const { protocol, hostname } = new URL(url);
      if (protocol === 'kairon:') return null;
      return 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64';
    } catch {
      return null;
    }
  }

  // ── STATS CALCULATION ────────────────────────────────────
  function calculateStats() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    let todayVisits = 0;
    let yesterdayVisits = 0;
    let totalVisits = 0;
    let totalBrowsingTime = 0;
    let uniqueDomains = new Set();

    for (const entry of allEntries) {
      const entryDate = new Date(entry.lastVisited);
      const entryDateOnly = new Date(entryDate.getFullYear(), entryDate.getMonth(), entryDate.getDate());

      totalVisits += entry.visitCount || 1;

      if (entryDateOnly.getTime() === today.getTime()) {
        todayVisits += entry.visitCount || 1;
      } else if (entryDateOnly.getTime() === yesterday.getTime()) {
        yesterdayVisits += entry.visitCount || 1;
      }

      try {
        const url = new URL(entry.url);
        uniqueDomains.add(url.hostname);
      } catch {}

      totalBrowsingTime += entry.timeSpent || 0;
    }

    const todayChange = yesterdayVisits > 0 ? ((todayVisits - yesterdayVisits) / yesterdayVisits * 100).toFixed(0) : 0;

    return {
      pagesVisited: allEntries.length,
      totalVisits: totalVisits,
      browsingTime: formatBrowsingTime(totalBrowsingTime),
      uniqueDomains: uniqueDomains.size,
      todayChange: todayChange
    };
  }

  function formatBrowsingTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    if (hours > 0) return hours + 'h ' + minutes + 'm';
    return minutes + 'm';
  }

  function trendLabel(change) {
    const n = Number(change) || 0;
    const arrow = n > 0 ? '↑' : n < 0 ? '↓' : '·';
    return arrow + ' ' + Math.abs(n) + '% from yesterday';
  }

  // ── RENDER STATS ─────────────────────────────────────────
  function renderStats() {
    const stats = calculateStats();

    statsGrid.innerHTML = `
      <div class="stat-card">
        <div class="stat-card-header">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 8h13M8 1.5C6 4 6 12 8 14.5M8 1.5c2 2.5 2 10.5 0 13" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>Pages Visited</span>
        </div>
        <div class="stat-card-value">${stats.pagesVisited}</div>
        <div class="stat-card-trend">${trendLabel(stats.todayChange)}</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-header">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 12l4-4 3 3 5-6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 5h3v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Total Visits</span>
        </div>
        <div class="stat-card-value">${stats.totalVisits.toLocaleString()}</div>
        <div class="stat-card-trend">${trendLabel(stats.todayChange)}</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-header">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 4v4l3 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span>Time Browsing</span>
        </div>
        <div class="stat-card-value">${stats.browsingTime}</div>
        <div class="stat-card-trend">· —</div>
      </div>

      <div class="stat-card">
        <div class="stat-card-header">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.8 4.6 4.7.3-3.7 3 1.3 4.6L8 11.2l-4.1 2.8 1.3-4.6-3.7-3 4.7-.3z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span>Unique Domains</span>
        </div>
        <div class="stat-card-value">${stats.uniqueDomains}</div>
        <div class="stat-card-trend">· —</div>
      </div>
    `;
  }

  // ── RENDER MOST VISITED ──────────────────────────────────
  function renderMostVisited() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const todayEntries = allEntries.filter(e => {
      const eDate = new Date(e.lastVisited);
      const eDateOnly = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate());
      return eDateOnly.getTime() === today.getTime();
    }).sort((a, b) => (b.visitCount || 1) - (a.visitCount || 1)).slice(0, 5);

    if (todayEntries.length === 0) {
      mostVisitedGrid.innerHTML = '<p style="color: var(--text-tertiary); font-size: 12px; align-self:center;">No visits today yet</p>';
      return;
    }

    mostVisitedGrid.innerHTML = todayEntries.map(entry => {
      const faviconUrl = entry.favicon || getFaviconUrl(entry.url);
      const title = entry.title || entry.url;
      const shortTitle = (formatUrl(entry.url).split('/')[0] || title).replace(/^www\./, '');
      const visits = entry.visitCount || 1;

      return `
        <div class="most-visited-item" data-url="${entry.url.replace(/"/g, '&quot;')}">
          <div class="most-visited-item-favicon">
            ${faviconUrl ? `<img src="${sanitizeFaviconUrl(faviconUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
          </div>
          <div class="most-visited-item-title">${sanitizeText(shortTitle)}</div>
          <div class="most-visited-item-visits">${visits} visit${visits !== 1 ? 's' : ''}</div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.most-visited-item').forEach(el => {
      el.addEventListener('click', () => {
        const url = el.dataset.url;
        if (url && kairon) kairon.openHistoryEntry(url);
      });
    });
  }

  // ── RENDER ──────────────────────────────────────────────
  function render() {
    const needle = searchQuery.trim().toLowerCase();
    const filtered = needle
      ? allEntries.filter(e => e.title.toLowerCase().includes(needle) || e.url.toLowerCase().includes(needle))
      : allEntries;

    entryCount.textContent = allEntries.length + ' entr' + (allEntries.length !== 1 ? 'ies' : 'y');

    renderStats();
    renderMostVisited();

    if (filtered.length === 0) {
      content.innerHTML = `
        <div id="empty-state">
          <div id="empty-illustration">
            <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
              <ellipse cx="60" cy="88" rx="34" ry="5" fill="#ffffff" opacity="0.04"/>
              <g style="animation: floatGlow 3.5s ease-in-out infinite;">
                <path d="M22 52 L60 34 L98 52 L98 66 L60 84 L22 66 Z" fill="#141414" stroke="var(--border-1)" stroke-width="1.2"/>
                <path d="M22 52 L60 70 L98 52" stroke="var(--border-1)" stroke-width="1.2" fill="none"/>
                <path d="M60 70 L60 84" stroke="var(--border-1)" stroke-width="1.2"/>
                <path d="M22 52 L44 41 M98 52 L76 41" stroke="var(--border-1)" stroke-width="1.2"/>
                <circle cx="60" cy="46" r="10" fill="#ffffff" opacity="0.85"/>
                <circle cx="60" cy="46" r="17" fill="#ffffff" opacity="0.08"/>
              </g>
              <g fill="#ffffff">
                <circle cx="24" cy="20" r="1.6" opacity="0.6" style="animation: twinkle 2.2s ease-in-out infinite;"/>
                <circle cx="96" cy="26" r="1.3" opacity="0.5" style="animation: twinkle 2.6s ease-in-out infinite 0.4s;"/>
                <circle cx="80" cy="12" r="1.1" opacity="0.4" style="animation: twinkle 1.8s ease-in-out infinite 0.8s;"/>
                <circle cx="40" cy="10" r="1" opacity="0.45" style="animation: twinkle 2.4s ease-in-out infinite 1.1s;"/>
                <circle cx="16" cy="40" r="1.2" opacity="0.4" style="animation: twinkle 2.1s ease-in-out infinite 0.2s;"/>
              </g>
            </svg>
          </div>
          <div id="empty-state-text">
            <h3>${needle ? 'No matching history' : 'No history yet'}</h3>
            <p>${needle ? 'Try a different search term.' : 'When you browse the web, your history will appear here.'}</p>
            ${needle ? '' : '<p class="tip">Tip: Your history is only visible to you and never leaves your device.</p>'}
          </div>
        </div>`;
      return;
    }

    const groups = [[], [], [], [], []];
    for (const entry of filtered) {
      const gk = getGroupKey(entry.lastVisited);
      groups[gk].push(entry);
    }
    for (const g of groups) g.sort((a, b) => b.lastVisited - a.lastVisited);

    let html = '';
    let delay = 0;
    for (let gi = 0; gi < groups.length; gi++) {
      const entries = groups[gi];
      if (entries.length === 0) continue;

      html += '<div class="group">'
        + '<div class="group-header">'
        + '<h2>' + GROUP_LABELS[gi] + '</h2>'
        + '<span class="group-count">' + entries.length + ' entries</span>'
        + '<span class="group-line"></span>'
        + '<svg class="toggle-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '</div>'
        + '<div class="group-content">';

      for (const entry of entries) {
        const faviconUrl = entry.favicon || getFaviconUrl(entry.url);
        const timeStr = formatTime(entry.lastVisited, gi);
        const dispUrl = formatUrl(entry.url);
        const title = entry.title || entry.url;
        const isBookmarked = bookmarked.has(entry.id);

        html += '<div class="history-item" data-url="' + entry.url.replace(/"/g, '&quot;') + '" data-id="' + entry.id + '" style="animation-delay:' + delay + 'ms">'
          + '<div class="history-item-favicon">'
          + (faviconUrl
            ? '<img src="' + sanitizeFaviconUrl(faviconUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
            : '')
          + '<div class="fallback-icon"' + (faviconUrl ? ' style="display:none"' : '') + '>'
          + '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 8h13M8 1.5C6 4 6 12 8 14.5M8 1.5c2 2.5 2 10.5 0 13" stroke="currentColor" stroke-width="1.2"/></svg>'
          + '</div>'
          + '</div>'
          + '<div class="history-item-body">'
          + '<div class="history-item-title">' + sanitizeText(title) + '</div>'
          + '<div class="history-item-url">' + sanitizeText(dispUrl) + '</div>'
          + '</div>'
          + '<div class="history-item-meta">'
          + '<span class="history-item-time">' + timeStr + '</span>'
          + '<span class="history-item-visits">' + (entry.visitCount || 1) + ' visit' + ((entry.visitCount || 1) !== 1 ? 's' : '') + '</span>'
          + '<button class="history-item-action-btn bookmark' + (isBookmarked ? ' active' : '') + '" data-id="' + entry.id + '" title="Bookmark" aria-label="Bookmark">'
          + '<svg width="14" height="14" viewBox="0 0 14 14" fill="' + (isBookmarked ? 'currentColor' : 'none') + '"><path d="M3.5 2.5h7c.55 0 1 .45 1 1V12l-4.5-2.5L2.5 12V3.5c0-.55.45-1 1-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>'
          + '</button>'
          + '<span class="history-item-device">' + DEVICE_ICON + '<span>This Device</span></span>'
          + '<button class="history-item-action-btn delete" data-id="' + entry.id + '" title="Remove entry" aria-label="Remove from history">'
          + '<svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M4.5 3V2a1 1 0 011-1h1a1 1 0 011 1v1M5 5.5v3M7 5.5v3M9.5 3l-.5 6.5a1 1 0 01-1 .9H4a1 1 0 01-1-.9L2.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          + '</button>'
          + '</div>'
          + '</div>';
        delay = Math.min(delay + 15, 150);
      }

      html += '</div></div>';
    }

    content.innerHTML = html;

    document.querySelectorAll('.history-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.history-item-action-btn')) return;
        const url = el.dataset.url;
        if (url && kairon) kairon.openHistoryEntry(url);
      });
    });

    document.querySelectorAll('.history-item-action-btn.delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id, 10);
        if (!isNaN(id)) deleteEntry(id);
      });
    });

    document.querySelectorAll('.history-item-action-btn.bookmark').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id, 10);
        if (isNaN(id)) return;
        if (bookmarked.has(id)) bookmarked.delete(id); else bookmarked.add(id);
        render();
      });
    });

    document.querySelectorAll('.group-header').forEach(header => {
      header.addEventListener('click', () => {
        header.classList.toggle('collapsed');
        const c = header.nextElementSibling;
        if (c && c.classList.contains('group-content')) c.classList.toggle('collapsed');
      });
    });
  }

  // ── DELETE ───────────────────────────────────────────────
  function deleteEntry(id) {
    kairon.deleteHistoryEntry(id).then(() => {
      allEntries = allEntries.filter(e => e.id !== id);
      render();
    }).catch(err => {
      console.error('[history] delete failed:', err);
    });
  }

  // ── CLEAR ────────────────────────────────────────────────
  function showClearConfirmation() { modalOverlay.classList.add('active'); }
  function hideClearConfirmation() { modalOverlay.classList.remove('active'); }

  function clearAllHistory() {
    kairon.clearHistory().then(() => {
      allEntries = [];
      render();
      hideClearConfirmation();
    }).catch(err => {
      console.error('[history] clear failed:', err);
      hideClearConfirmation();
    });
  }

  // ── LOAD ─────────────────────────────────────────────────
  async function loadHistory() {
    try {
      allEntries = await kairon.getHistory(10000, 0);
    } catch (err) {
      console.error('[history] load failed:', err);
      allEntries = [];
    }
    render();
  }

  // ── UTILITY ──────────────────────────────────────────────
  function sanitizeText(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Favicon URL sanitizer: validates protocol and escapes HTML-special chars.
  var _SAFE_FAV_PROTOS = new Set(['http:', 'https:', 'data:']);
  function sanitizeFaviconUrl(url) {
    if (typeof url !== 'string' || !url) return '';
    try {
      var p = new URL(url);
      if (!_SAFE_FAV_PROTOS.has(p.protocol)) return '';
      if (p.protocol === 'data:' && !url.toLowerCase().startsWith('data:image/')) return '';
    } catch { return ''; }
    return url.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── SEARCH DEBOUNCE ──────────────────────────────────────
  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = searchInput.value;
      render();
    }, 150);
  });

  // ── EVENT BINDING ────────────────────────────────────────
  btnClear.addEventListener('click', showClearConfirmation);
  btnModalCancel.addEventListener('click', hideClearConfirmation);
  btnModalConfirm.addEventListener('click', clearAllHistory);

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) hideClearConfirmation();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modalOverlay.classList.contains('active')) {
        hideClearConfirmation();
      } else if (searchInput.value) {
        searchInput.value = '';
        searchQuery = '';
        render();
      }
    }
  });

  // ── INIT ─────────────────────────────────────────────────
  loadHistory();
})();
</script>

<script>
  // ── GLOBAL THEME LIVE SYNC ───────────────────────────────
  // The persisted Theme Mode (FeatureStore) is the single source of truth.
  // Main re-pushes the full snapshot to every Kairon-owned internal page on
  // change; flip instantly and re-enable transitions after one frame.
  (function () {
    function applyTheme(mode) {
      var theme = mode === 'light' ? 'light' : 'dark';
      var root = document.documentElement;        if (root.dataset.theme === theme) return;
        root.classList.add('theme-switching');
        void root.offsetHeight; // recalc so the transition rule is active before values change
        root.dataset.theme = theme;
        setTimeout(function () { root.classList.remove('theme-switching'); }, 300);
    }
    try {
      window.kairon.onSettingsUpdated(function (snapshot) {
        var mode = snapshot && snapshot.state && snapshot.state.themeSystem && snapshot.state.themeSystem.settings && snapshot.state.themeSystem.settings.mode;
        if (mode) applyTheme(mode);
      });
    } catch (e) {}
  })();
</script>
