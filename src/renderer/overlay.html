<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>Orion Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    /* ── GLOBAL THEME ──────────────────────────────────────────
       The omnibox suggestions overlay consumes the SAME persisted Theme Mode
       as the rest of the browser chrome (FeatureStore → ?theme= query at load,
       live-synced via settings-updated). Dark values below are the exact
       pre-theme colors — unchanged. The light palette mirrors the chrome's
       monochrome light vocabulary (off-white surface, dark ink, subtle gray
       border, light-gray hover rows, dark icons). */
    :root {
      color-scheme: dark;
      --sugg-bg: #1a1a1a;
      --sugg-border: #333;
      --sugg-text: #EDEDED;
      --sugg-text-hover: #FFFFFF;
      --sugg-text-secondary: rgba(255, 255, 255, 0.6);
      --sugg-hover-bg: rgba(255, 255, 255, 0.06);
      --sugg-icon-opacity: 0.5;
    }

    :root[data-theme='light'] {
      color-scheme: light;
      --sugg-bg: #fbfbfb;
      --sugg-border: #e0e0e0;
      --sugg-text: #1a1a1a;
      --sugg-text-hover: #1a1a1a;
      --sugg-text-secondary: #5f5f5f;
      --sugg-hover-bg: rgba(0, 0, 0, 0.05);
      --sugg-icon-opacity: 0.6;
    }

    /* ── DOWNLOADS PANEL ────────────────────────────────────────
       Monochrome floating panel anchored to the toolbar Downloads button.
       Dark: near-black charcoal with a subtle purple-gray tint, thin
       low-contrast border, muted secondary text, subtle row separators and
       monochrome buttons — no gradients, minimal shadow. Light: the same
       panel re-skins through the shared Kairon light vocabulary (off-white
       surface, dark ink, gray borders) via the data-theme switch. */
    :root {
      --dl-bg:          #000000;
      --dl-bg-hover:    rgba(255, 255, 255, 0.055);
      --dl-bg-active:   rgba(255, 255, 255, 0.09);
      --dl-border:      rgba(255, 255, 255, 0.09);
      --dl-divider:     rgba(255, 255, 255, 0.07);
      --dl-text:        #eef0f8;
      --dl-text-2:      #8b93b5;
      --dl-text-3:      #5d6480;
      --dl-icon-bg:     rgba(255, 255, 255, 0.05);
      --dl-icon-border: rgba(255, 255, 255, 0.08);
      --dl-btn-bg:      rgba(255, 255, 255, 0.045);
      --dl-btn-border:  rgba(255, 255, 255, 0.10);
      --dl-btn-hover:   rgba(255, 255, 255, 0.09);
      --dl-progress:    rgba(255, 255, 255, 0.16);
      --dl-progress-fill: #ffffff;
      --dl-success:     #34d39b;
      --dl-danger:      #f26b6b;
    }

    :root[data-theme='light'] {
      --dl-bg:          #ffffff;
      --dl-bg-hover:    rgba(0, 0, 0, 0.05);
      --dl-bg-active:   rgba(0, 0, 0, 0.08);
      --dl-border:      rgba(0, 0, 0, 0.12);
      --dl-divider:     rgba(0, 0, 0, 0.07);
      --dl-text:        #1a1a1a;
      --dl-text-2:      #5f5f5f;
      --dl-text-3:      #8a8a8a;
      --dl-icon-bg:     rgba(0, 0, 0, 0.04);
      --dl-icon-border: rgba(0, 0, 0, 0.08);
      --dl-btn-bg:      rgba(0, 0, 0, 0.04);
      --dl-btn-border:  rgba(0, 0, 0, 0.12);
      --dl-btn-hover:   rgba(0, 0, 0, 0.08);
      --dl-progress:    rgba(0, 0, 0, 0.12);
      --dl-progress-fill: #1a1a1a;
      --dl-success:     #2fae7e;
      --dl-danger:      #d64545;
    }

    /* Theme flip: suspend transitions for one frame so the dropdown re-skins
       instantly (same as the chrome and internal pages). */
    /* Theme flip: animate theme-dependent properties so Light↔Dark switches
       feel smooth (downloads panel + suggestions re-skin with the rest of the
       chrome). The flip class drops ~300ms after the switch, which also snaps
       any transition Chromium froze in a hidden/occluded window to the new
       theme values (no stale colors). */
    :root.theme-switching, :root.theme-switching *, :root.theme-switching *::before, :root.theme-switching *::after {
      transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, outline-color 220ms ease, box-shadow 220ms ease, fill 220ms ease, stroke 220ms ease !important;
      animation: none !important;
    }

    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #overlay-root {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #address-suggestions {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
      background: var(--sugg-bg);
      border: 1px solid var(--sugg-border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      margin-top: 0;
      display: none;
      pointer-events: auto;
    }
    .address-suggestion-item {
      width: 100%;
      border: none;
      border-radius: 0;
      padding: 12px 20px;
      min-height: 44px;
      text-align: left;
      background: transparent;
      color: var(--sugg-text);
      font-size: 14px;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 150ms ease;
      pointer-events: auto;
    }
    .address-suggestion-item:hover,
    .address-suggestion-item[aria-selected="true"] {
      background: var(--sugg-hover-bg);
      color: var(--sugg-text-hover);
    }
    .address-suggestion-item.address-suggestion-search {
      color: var(--sugg-text-secondary);
    }
    .address-suggestion-item span {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow: hidden;
    }
    .address-suggestion-item span:last-child {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Rich suggestion layout — icon column | title + URL */
    .address-suggestion-item .sugg-icon-col {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      flex-shrink: 0;
      overflow: visible;
    }
    .address-suggestion-item .sugg-text-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: normal;
      text-overflow: clip;
    }
    .address-suggestion-item .sugg-title {
      display: block;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      color: var(--sugg-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .address-suggestion-item .sugg-url {
      display: block;
      width: 100%;
      font-size: 12px;
      color: var(--sugg-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .address-suggestion-item[aria-selected="true"] .sugg-title {
      color: var(--sugg-text-hover);
    }
    .address-suggestion-item[aria-selected="true"] .sugg-url {
      color: var(--sugg-text-secondary);
    }

    /* ── DOWNLOADS PANEL LAYOUT ────────────────────────────── */
    #downloads-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--dl-bg);
      border: 1px solid var(--dl-border);
      border-radius: 10px;
      overflow: hidden;
      pointer-events: auto;
      color: var(--dl-text);
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    #downloads-panel[hidden] { display: none; }

    #downloads-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 14px 0 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--dl-divider);
    }
    #downloads-panel-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #downloads-menu-wrap { position: relative; }

    .dl-icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--dl-text-2);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .dl-icon-btn:hover { background: var(--dl-btn-hover); color: var(--dl-text); }
    .dl-icon-btn:focus, .dl-icon-btn:focus-visible { outline: none; }
    .dl-icon-btn svg { display: block; }

    #downloads-menu {
      position: absolute;
      top: 34px;
      right: 0;
      min-width: 200px;
      padding: 6px;
      background: var(--dl-bg);
      border: 1px solid var(--dl-border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }
    #downloads-menu[hidden] { display: none; }
    #downloads-menu button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      text-align: left;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--dl-text);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }
    #downloads-menu button:hover { background: var(--dl-bg-hover); }
    #downloads-menu button:focus, #downloads-menu button:focus-visible { outline: none; }

    #downloads-panel-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px;
    }
    #downloads-panel-list::-webkit-scrollbar { width: 8px; }
    #downloads-panel-list::-webkit-scrollbar-thumb { background: var(--dl-divider); border-radius: 9999px; }
    #downloads-panel-list::-webkit-scrollbar-thumb:hover { background: var(--dl-progress); }

    #downloads-empty {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dl-text-3);
      font-size: 12.5px;
    }

    .dl-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: default;
      transition: background 120ms ease;
      user-select: none;
    }
    .dl-row:hover { background: var(--dl-bg-hover); }
    .dl-row:focus, .dl-row:focus-visible { outline: none; }
    .dl-row.openable { cursor: pointer; }

    .dl-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--dl-icon-bg);
      border: 1px solid var(--dl-icon-border);
      color: var(--dl-text-2);
    }
    .dl-icon svg { display: block; }

    .dl-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .dl-filename {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--dl-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-status {
      font-size: 11px;
      color: var(--dl-text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-status.failed { color: var(--dl-danger); }

    .dl-progress {
      width: 100%;
      height: 3px;
      border-radius: 9999px;
      background: var(--dl-progress);
      overflow: hidden;
      margin-top: 1px;
    }
    .dl-progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: var(--dl-progress-fill);
      transition: width 200ms ease;
    }

    .dl-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .dl-actions .dl-icon-btn { width: 26px; height: 26px; border-radius: 6px; }

    #downloads-panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 10px;
      flex-shrink: 0;
      border-top: 1px solid var(--dl-divider);
    }
    .dl-footer-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid var(--dl-btn-border);
      border-radius: 7px;
      background: var(--dl-btn-bg);
      color: var(--dl-text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .dl-footer-btn:hover { background: var(--dl-btn-hover); border-color: var(--dl-border); }
    .dl-footer-btn:focus, .dl-footer-btn:focus-visible { outline: none; }
    .dl-footer-btn.dl-primary {
      background: var(--dl-progress-fill);
      border-color: var(--dl-progress-fill);
      color: var(--dl-bg);
      font-weight: 600;
    }
    .dl-footer-btn.dl-primary:hover { background: var(--dl-btn-hover); border-color: var(--dl-border); color: var(--dl-text); }

    /* ── APPLICATION MENU ────────────────────────────────────────
       Monochrome desktop-style menu rendered by the overlay window so it
       always paints above BrowserView content. Same surface language as the
       downloads panel: near-black charcoal, thin low-contrast border, subtle
       row hover, right-aligned shortcut labels — no gradients, no color. */
    :root {
      --am-bg:          #000000;
      --am-bg-hover:    rgba(255, 255, 255, 0.055);
      --am-bg-active:   rgba(255, 255, 255, 0.09);
      --am-border:      rgba(255, 255, 255, 0.09);
      --am-divider:     rgba(255, 255, 255, 0.07);
      --am-text:        #eef0f8;
      --am-text-2:      #8b93b5;
      --am-text-3:      #5d6480;
      --am-disabled:    #3d4255;
      --am-focus:       rgba(255, 255, 255, 0.18);
      --am-overlay:     rgba(0, 0, 0, 0.55);
    }

    :root[data-theme='light'] {
      --am-bg:          #ffffff;
      --am-bg-hover:    rgba(0, 0, 0, 0.05);
      --am-bg-active:   rgba(0, 0, 0, 0.08);
      --am-border:      rgba(0, 0, 0, 0.12);
      --am-divider:     rgba(0, 0, 0, 0.07);
      --am-text:        #1a1a1a;
      --am-text-2:      #5f5f5f;
      --am-text-3:      #8a8a8a;
      --am-disabled:    #b3b3b3;
      --am-focus:       rgba(0, 0, 0, 0.18);
      --am-overlay:     rgba(0, 0, 0, 0.40);
    }

    /* The menu fills the overlay exactly; height is clamped by main when the
       window is too short, and the list scrolls internally in that case. */
    #app-menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 284px;
      height: 100%;
      box-sizing: border-box;
      padding: 6px;
      background: var(--am-bg);
      border: 1px solid var(--am-border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
      color: var(--am-text);
      font-size: 13px;
      line-height: 1.4;
      transform-origin: top left;
      animation: am-in 150ms cubic-bezier(0.2, 0.7, 0.3, 1);
      /* The overlay body/root are pointer-transparent by design (omnibox
         click-through model); interactive panels re-enable it. Inherited by
         every menu item, so hover + clicks work while the menu is open. */
      pointer-events: auto;
    }
    #app-menu[hidden] { display: none; }
    #app-menu.am-closing { animation: am-out 130ms ease-in forwards; }
    #app-menu::-webkit-scrollbar { width: 8px; }
    #app-menu::-webkit-scrollbar-thumb { background: var(--am-divider); border-radius: 9999px; }
    #app-menu::-webkit-scrollbar-thumb:hover { background: var(--am-text-3); }
    @keyframes am-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes am-out {
      from { opacity: 1; transform: none; }
      to   { opacity: 0; transform: translateY(-4px) scale(0.99); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-menu, #app-menu.am-closing { animation: none; }
    }

    .am-label {
      padding: 10px 14px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--am-text-3);
      user-select: none;
    }
    .am-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      height: 30px;
      padding: 0 14px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--am-text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background 90ms ease, color 90ms ease;
    }
    .am-item:hover:not(:disabled) { background: var(--am-bg-hover); }
    .am-item:active:not(:disabled) { background: var(--am-bg-active); }
    .am-item:focus, .am-item:focus-visible { outline: none; }
    .am-item:disabled { color: var(--am-disabled); cursor: default; }
    .am-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .am-shortcut {
      flex-shrink: 0;
      font-family: 'Geist Mono', 'SF Mono', monospace;
      font-size: 10.5px;
      color: var(--am-text-3);
    }
    .am-item:disabled .am-shortcut { color: var(--am-disabled); }
    .am-note {
      flex-shrink: 0;
      font-size: 10.5px;
      color: var(--am-disabled);
    }
    .am-sep {
      height: 1px;
      margin: 7px 14px;
      background: var(--am-divider);
    }

    .am-zoom-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      margin: 0 4px;
    }
    .am-zoom-btn {
      width: 30px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--am-divider);
      border-radius: 7px;
      background: transparent;
      color: var(--am-text);
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: background 90ms ease;
    }
    .am-zoom-btn:hover { background: var(--am-bg-hover); }
    .am-zoom-btn:active { background: var(--am-bg-active); }
    .am-zoom-btn:focus, .am-zoom-btn:focus-visible { outline: none; }
    .am-zoom-value {
      flex: 1;
      text-align: center;
      font-family: 'Geist Mono', 'SF Mono', monospace;
      font-size: 11px;
      color: var(--am-text-2);
      user-select: none;
    }
    .am-zoom-reset {
      width: 30px;
      height: 26px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--am-text-3);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 90ms ease, color 90ms ease;
    }
    .am-zoom-reset:hover { background: var(--am-bg-hover); color: var(--am-text); }
    .am-zoom-reset:focus, .am-zoom-reset:focus-visible { outline: none; }

    .am-updater-block {
      padding: 6px 14px 4px;
      user-select: none;
    }
    .am-update-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--am-text);
      margin-bottom: 2px;
    }
    .am-update-dot {
      font-size: 8px;
      line-height: 1;
      color: var(--am-text);
    }
    .am-version-text {
      font-family: 'Geist Mono', 'SF Mono', monospace;
      font-size: 11px;
      color: var(--am-text-3);
    }
    .am-update-btn {
      margin-top: 8px;
      height: 28px;
      background: var(--am-text);
      color: var(--am-bg);
      font-weight: 600;
      justify-content: center;
      text-align: center;
      border-radius: 6px;
    }
    .am-update-btn:hover:not(:disabled) {
      background: var(--am-text);
      opacity: 0.92;
      color: var(--am-bg);
    }

    /* ── STAR POPUP (Quick Access / Bookmarks chooser) ────────
       Tiny two-option popdown anchored under the chrome's star button. Same
       surface language as the app menu / downloads panel: pure black in dark
       mode, the existing light surface in light mode, monochrome, no
       gradients, thin low-contrast border, subtle row hover. Fills the
       overlay exactly — main sizes the overlay to the popup rect. */
    #star-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 6px;
      background: var(--am-bg);
      border: 1px solid var(--am-border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      color: var(--am-text);
      font-size: 13px;
      line-height: 1.4;
      transform-origin: top right;
      /* Reuses the app menu's enter/exit animations (am-in/am-out). */
      animation: am-in 140ms cubic-bezier(0.2, 0.7, 0.3, 1);
      pointer-events: auto;
    }
    #star-popup[hidden] { display: none; }
    #star-popup.sp-closing { animation: am-out 120ms ease-in forwards; }
    @media (prefers-reduced-motion: reduce) {
      #star-popup, #star-popup.sp-closing { animation: none; }
    }
    .sp-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--am-text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background 90ms ease, color 90ms ease;
    }
    .sp-item:hover:not(:disabled) { background: var(--am-bg-hover); }
    .sp-item:active:not(:disabled) { background: var(--am-bg-active); }
    .sp-item:focus, .sp-item:focus-visible { outline: none; }
    .sp-item:disabled { color: var(--am-disabled); cursor: default; }
    .sp-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      color: var(--am-text-2);
    }
    .sp-item:disabled .sp-icon { color: var(--am-disabled); }
    .sp-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── ABOUT DIALOG ───────────────────────────────────────────
       Centered modal rendered by the overlay at full-window size (the overlay
       covers the whole window when no panel is open). Monochrome card on a
       dimmed backdrop — same design language as the rest of Kairon. */
    #about-dialog {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      /* Same pointer model as the app menu: the backdrop and card (close
         button) must receive clicks while the dialog is open. */
      pointer-events: auto;
    }
    #about-dialog[hidden] { display: none; }
    #about-backdrop {
      position: absolute;
      inset: 0;
      background: var(--am-overlay);
    }
    #about-card {
      position: relative;
      width: 320px;
      padding: 28px 28px 24px;
      background: var(--am-bg);
      border: 1px solid var(--am-border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: var(--am-text);
      transform-origin: center;
      animation: am-in 160ms cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    #about-logo { width: 42px; height: 42px; margin: 0 auto 14px; }
    #about-logo svg { display: block; }
    #about-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
    #about-version {
      font-size: 11px;
      font-family: 'Geist Mono', 'SF Mono', monospace;
      color: var(--am-text-3);
      margin: 0 0 14px;
    }
    #about-desc { font-size: 12.5px; color: var(--am-text-2); line-height: 1.5; margin: 0 0 20px; }
    #about-close {
      height: 30px;
      padding: 0 18px;
      border: 1px solid var(--am-border);
      border-radius: 7px;
      background: var(--am-bg-hover);
      color: var(--am-text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 90ms ease;
    }
    #about-close:hover { background: var(--am-bg-active); }
    #about-close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--am-focus); }

    /* ── TOAST ────────────────────────────────────────────────
       Subtle transient feedback (bookmark add/remove) rendered by the overlay
       so it always paints above BrowserView content. Monochrome, matches the
       internal-page toast pattern. */
    :root {
      --toast-bg:    #111111;
      --toast-border: #2a2a2a;
      --toast-text:  #e4e4e4;
    }
    :root[data-theme='light'] {
      --toast-bg:    #2a2a2a;
      --toast-border: #3c3c3c;
      --toast-text:  #f1f1f1;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--toast-border);
      background: var(--toast-bg);
      color: var(--toast-text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      opacity: 0;
      transition: opacity 150ms ease;
      pointer-events: none;
      user-select: none;
    }
    #toast.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      #toast { transition: none; }
    }
  </style>
  <script>
    // Apply the persisted theme before first paint: the main process passes the
    // current FeatureStore value as ?theme= when loading the overlay. Live
    // changes arrive via settings-updated (see the sync script at the end).
    try {
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="overlay-root">
    <div id="address-suggestions" role="listbox"></div>

    <!-- Downloads panel — anchored to the toolbar Downloads button. The main
         process sizes the overlay to exactly this panel's rect, so it paints
         above BrowserView content and only captures mouse events over itself. -->
    <div id="downloads-panel" role="dialog" aria-label="Downloads" hidden>
      <div id="downloads-panel-header">
        <span id="downloads-panel-title">Downloads</span>
        <div id="downloads-menu-wrap">
          <button id="downloads-menu-btn" class="dl-icon-btn" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <circle cx="7.5" cy="3" r="1.1" fill="currentColor"/>
              <circle cx="7.5" cy="7.5" r="1.1" fill="currentColor"/>
              <circle cx="7.5" cy="12" r="1.1" fill="currentColor"/>
            </svg>
          </button>
          <div id="downloads-menu" role="menu" aria-label="Download actions" hidden>
            <button role="menuitem" data-action="open-folder">Open downloads folder</button>
            <button role="menuitem" data-action="clear-completed">Clear completed downloads</button>
          </div>
        </div>
      </div>
      <div id="downloads-panel-list" role="list"></div>
      <div id="downloads-panel-footer">
        <button id="downloads-clear-btn" class="dl-footer-btn">Clear</button>
        <button id="downloads-show-more-btn" class="dl-footer-btn dl-primary">Show more</button>
      </div>
    </div>

    <!-- Application menu — anchored to the menu button in the top-left of the
         chrome. The main process sizes the overlay to exactly this menu's
         rect, so it paints above BrowserView content and only captures mouse
         events over itself. Disabled items reflect features that don't exist
         yet (New Window, Bookmarks, Extensions) or the live browser state
         (Back/Forward). -->
    <div id="app-menu" role="menu" aria-label="Kairon application menu" hidden>
      <div class="am-section" role="presentation">
        <div class="am-label">Main</div>
        <button type="button" class="am-item" role="menuitem" data-action="new-tab"><span class="am-name">New Tab</span><span class="am-shortcut">Ctrl+T</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="new-window"><span class="am-name">New Window</span><span class="am-shortcut">Ctrl+N</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="new-incognito"><span class="am-name">New Incognito Window</span><span class="am-shortcut">Ctrl+Shift+N</span></button>
      </div>
      <div class="am-sep" role="separator"></div>
      <div class="am-section" role="presentation">
        <div class="am-label">Page</div>
        <button type="button" class="am-item" role="menuitem" data-action="back"><span class="am-name">Back</span><span class="am-shortcut">Alt+←</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="forward"><span class="am-name">Forward</span><span class="am-shortcut">Alt+→</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="reload"><span class="am-name">Reload</span><span class="am-shortcut">Ctrl+R</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="find"><span class="am-name">Find</span><span class="am-shortcut">Ctrl+F</span></button>
        <div class="am-zoom-row" role="group" aria-label="Page zoom">
          <button type="button" class="am-zoom-btn" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <span class="am-zoom-value" id="am-zoom-value" aria-live="polite">100%</span>
          <button type="button" class="am-zoom-btn" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" class="am-zoom-reset" data-action="zoom-reset" title="Reset zoom" aria-label="Reset zoom">↺</button>
        </div>
        <button type="button" class="am-item" role="menuitem" data-action="fullscreen"><span class="am-name" id="am-fullscreen-label">Enter Fullscreen</span><span class="am-shortcut">F11</span></button>
      </div>
      <div class="am-sep" role="separator"></div>
      <div class="am-section" role="presentation">
        <div class="am-label">Browser</div>
        <button type="button" class="am-item" role="menuitem" data-action="history"><span class="am-name">History</span><span class="am-shortcut">Ctrl+H</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="downloads"><span class="am-name">Downloads</span><span class="am-shortcut">Ctrl+J</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="bookmarks"><span class="am-name">Bookmarks</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="extensions" disabled><span class="am-name">Extensions</span><span class="am-note">Not available</span></button>
      </div>
      <div class="am-sep" role="separator"></div>
      <div class="am-section" role="presentation">
        <div class="am-label">Kairon</div>
        <button type="button" class="am-item" role="menuitem" data-action="settings"><span class="am-name">Settings</span><span class="am-shortcut">Ctrl+,</span></button>
        <button type="button" class="am-item" role="menuitem" data-action="about"><span class="am-name">About Kairon</span></button>
        <div class="am-updater-block">
          <div class="am-update-status" id="am-update-status" style="display: none;"><span class="am-update-dot">●</span> <span id="am-update-status-text">Update available</span></div>
          <div class="am-version-text" id="am-version-text">Version 1.0.0</div>
          <button type="button" class="am-item am-update-btn" id="am-update-btn" role="menuitem" data-action="restart-update" style="display: none;"><span class="am-name">Restart &amp; Update</span></button>
        </div>
      </div>
      <div class="am-sep" role="separator"></div>
      <div class="am-section" role="presentation">
        <div class="am-label">System</div>
        <button type="button" class="am-item" role="menuitem" data-action="exit"><span class="am-name">Exit</span><span class="am-shortcut">Alt+F4</span></button>
      </div>
    </div>

    <!-- Star popup — Quick Access / Bookmarks chooser anchored under the
         chrome's star button. Main sizes the overlay to exactly this popup's
         rect; overlay.js swaps the two row labels from the live main-process
         state ("Add"/"Remove" per current membership). -->
    <div id="star-popup" role="menu" aria-label="Page actions" hidden>
      <button type="button" class="sp-item" role="menuitem" data-action="quick-access" id="sp-quick-access-item">
        <span class="sp-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
            <rect x="7.5" y="1.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
            <rect x="1.5" y="7.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
            <rect x="7.5" y="7.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </span>
        <span class="sp-name" id="sp-quick-access-label">Add to Quick Access</span>
      </button>
      <button type="button" class="sp-item" role="menuitem" data-action="bookmark" id="sp-bookmark-item">
        <span class="sp-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path d="M2.5 1.5h8v10L6.5 9 2.5 11.5z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="sp-name" id="sp-bookmark-label">Add to Bookmarks</span>
      </button>
      <button type="button" class="sp-item" role="menuitem" data-action="custom-site" id="sp-custom-site-item">
        <span class="sp-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.1"/>
            <path d="M1.5 6.5h10M6.5 1.5C5 3.5 5 9.5 6.5 11.5M6.5 1.5c1.5 2 1.5 8 0 10" stroke="currentColor" stroke-width="1.1"/>
          </svg>
        </span>
        <span class="sp-name" id="sp-custom-site-label">Add to Custom Sites</span>
      </button>
    </div>

    <!-- About dialog — centered modal at full-window overlay size. -->
    <div id="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-title" hidden>
      <div id="about-backdrop"></div>
      <div id="about-card">
        <div id="about-logo" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" fill="#000000"/>
            <path d="M37.3333 20V108C37.3333 111.314 40.0196 114 43.3333 114C46.6471 114 49.3333 111.314 49.3333 108V71.2L90.1333 20C93.4667 14.4 101.467 15.2 104.133 18.8C106.8 22.4 106.267 28.4 102.4 32L60.9333 75.2L86.9333 108C90.1333 110.8 90.9333 116 88.8 119.6C86.6667 123.2 80.8 124 77.3333 121.6L37.3333 90.4V20Z" fill="white"/>
          </svg>
        </div>
        <h2 id="about-title">Kairon Browser</h2>
        <p id="about-version">Version 1.0.0</p>
        <p id="about-desc">A privacy-focused browser with a built-in AI sidebar.</p>
        <button type="button" id="about-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast — subtle transient feedback (bookmark add/remove). Shown by main
       positioning the overlay; auto-hides after its display cycle. -->
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="overlay.js"></script>
  <script>
    // ── GLOBAL THEME LIVE SYNC ─────────────────────────────
    // Same feed as every Kairon-owned page: the persisted Theme Mode
    // (FeatureStore) is the single source of truth, re-pushed by main on every
    // change. Flip instantly and re-enable transitions after one frame.
    (function () {
      function applyTheme(mode) {
        var theme = mode === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        if (root.dataset.theme === theme) return;
        root.classList.add('theme-switching');
        void root.offsetHeight; // recalc so the transition rule is active before values change
        root.dataset.theme = theme;
        setTimeout(function () { root.classList.remove('theme-switching'); }, 300);
      }
      try {
        window.kairon.onSettingsUpdated(function (snapshot) {
          var mode = snapshot && snapshot.state && snapshot.state.themeSystem && snapshot.state.themeSystem.settings && snapshot.state.themeSystem.settings.mode;
          if (mode) applyTheme(mode);
        });
      } catch (e) {}
    })();
  </script>
</body>
