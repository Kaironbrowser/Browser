<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.groq.com; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>Kairon</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══ LEFT RAIL ══════════════════════════════════════════ -->
  <aside id="left-rail" data-collapsed="false">
    <div id="rail-top">

      <div id="logo">
        <button id="btn-collapse-rail" class="icon-btn rail-collapse-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2.5 4.5h10M2.5 7.5h10M2.5 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="logo-mark">
          <img src="assets/kairon-logo.svg" alt="Kairon Logo" style="width: 22px; height: 22px;">
        </div>
        <span id="logo-text">Kairon</span>
      </div>

      <div id="tab-list"></div>

      <button id="btn-new-tab">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>New tab</span>
      </button>
    </div>

    <div id="rail-bottom">
      <button class="rail-btn" id="btn-toggle-ai" title="AI Assistant">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1.5" y="1.5" width="13" height="13" rx="3" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.5 6h7M4.5 9.5h4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="12.5" cy="3.5" r="2" fill="currentColor"/>
        </svg>
        <span>AI</span>
      </button>
      <button class="rail-btn" id="btn-open-history" title="History">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span>History</span>
      </button>
      <button class="rail-btn" id="btn-open-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.27 1.27M11.33 11.33l1.27 1.27M3.4 12.6l1.27-1.27M11.33 4.67l1.27-1.27" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>
  </aside>

  <!-- ══ CENTER COLUMN ═══════════════════════════════════════ -->
  <div id="center-col">

    <!-- Window Controls (absolutely positioned at top-right of center-col) -->
    <div id="win-controls">
      <button id="btn-min" title="Minimize" aria-label="Minimize">
        <svg width="9" height="9" viewBox="0 0 9 2"><rect width="9" height="1.5" rx="0.75" fill="currentColor"/></svg>
      </button>
      <button id="btn-max" title="Maximize" aria-label="Maximize">
        <svg width="9" height="9" viewBox="0 0 9 9"><rect x="0.75" y="0.75" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button id="btn-close" title="Close" aria-label="Close">
        <svg width="9" height="9" viewBox="0 0 9 9"><path d="M1 1l7 7M8 1L1 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Top Tab Bar -->
    <div id="top-tab-bar">
      <button class="btn-new-tab-top" id="btn-new-tab-top">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        New Tab
      </button>
    </div>

    <div id="chromebar">
      <div id="drag-zone"></div>

      <div id="nav-btns">
        <button class="nav-btn" id="btn-back" title="Go back" aria-label="Back">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M8.5 2L4 6.5 8.5 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="Go forward" aria-label="Forward">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M4.5 2L9 6.5 4.5 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="Reload" aria-label="Reload">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M10.8 6.5a4.3 4.3 0 1 1-1.06-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M9.74 2l.5 2.2-2.2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Omnibar — position:relative anchor for the suggestions dropdown -->
      <div id="omnibar-outer">
        <div id="omnibar">
          <span id="shield" title="Connection secure">
            <svg width="11" height="13" viewBox="0 0 11 13" fill="none">
              <path d="M5.5 1L1 3.2v3.4C1 9.4 3 11.8 5.5 12.6 8 11.8 10 9.4 10 6.6V3.2L5.5 1z" fill="#34d39b"/>
            </svg>
          </span>
          <input
            id="address-bar"
            type="text"
            placeholder="Search or enter address — ⌘K for commands"
            autocomplete="off"
            spellcheck="false"
            aria-label="Address bar"
          />
          <span id="spinner" class="hidden" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 13 13" class="spin-svg">
              <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="20" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <!-- Address Suggestions Dropdown (direct child of omnibar-outer) -->
        <div id="address-suggestions" style="display: none;">
          <!-- Items will be injected here -->
        </div>
      </div>

      <div id="zoom-controls" role="group" aria-label="Page zoom controls">
        <button class="zoom-btn" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoom-value" aria-live="polite">100%</span>
        <button class="zoom-btn" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="zoom-btn zoom-reset-btn" id="btn-zoom-reset" title="Reset zoom" aria-label="Reset zoom">↺</button>
      </div>

      <button class="nav-btn" id="btn-downloads" title="Downloads" aria-label="Downloads" aria-haspopup="dialog">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2v7M4.5 5.5 8 9l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span id="downloads-badge" class="hidden" aria-hidden="true">0</span>
      </button>

      <button class="chrome-menu-btn nav-btn" id="btn-chrome-settings" title="Settings" aria-label="Open settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4 5h10M4 9h10M4 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div id="status-strip">
      <div id="tracker-pill">
        <svg width="8" height="9" viewBox="0 0 8 10" fill="none">
          <path d="M4 0.5L0.5 2.3v2.8C.5 7.7 2 9.5 4 10.1 6 9.5 7.5 7.7 7.5 5.1V2.3L4 .5z" fill="#34d39b"/>
        </svg>
        <span id="total-count">0</span> total · <span id="blocked-count">0</span> blocked · <span id="not-blocked-count">0</span> allowed
      </div>
      <div id="page-title"></div>
    </div>
  </div>

  <!-- ══ AI PANEL ════════════════════════════════════════════ -->
  <div id="ai-panel" class="hidden" role="complementary" aria-label="AI Assistant">
    <div id="ai-header">
      <div id="ai-title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1"/>
          <circle cx="8" cy="8" r="3" fill="currentColor"/>
        </svg>
        <span>Kairon AI</span>
        <span id="model-tag">llama-3.3-70b</span>
      </div>
      <button id="btn-close-ai" aria-label="Close AI panel">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="messages" role="log" aria-live="polite"></div>

    <div id="input-area">
      <div id="input-wrap">
        <textarea id="chat-input" placeholder="Ask anything about this page…" rows="1" aria-label="Chat input"></textarea>
        <button id="btn-send" aria-label="Send message">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M1.5 6.5h10M7.5 2l4.5 4.5-4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p id="powered-by">Groq · Ultra-fast inference</p>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
