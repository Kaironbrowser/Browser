<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairon — Home</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Backgrounds */
      --bg: #000000;
      --surface-1: #050505;
      --surface-2: #0A0A0A;
      --surface-3: #111111;
      --surface-4: #1A1A1A;
      /* Borders & Highlights */
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.10);
      --highlight: rgba(255,255,255,0.06);
      --shadow-highlight: inset 0 1px 0 rgba(255,255,255,0.06);
      /* Text */
      --text: #eef0f8;
      --text-secondary: #8b93b5;
      --text-tertiary: #555e80;
      --text-muted: #555e80;
      /* Accent */
     --accent: #000000;
     --accent-soft: rgba(0,0,0,0.12);
     --accent-faint: rgba(0,0,0,0.06);
      /* Spacing */
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 20px;
      /* Radius */
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-full: 9999px;
      /* Shadows */
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.85);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.95);
      --shadow-lg: 0 8px 48px rgba(0,0,0,1);
      --shadow-focus: 0 0 0 2px var(--accent);
      /* Motion */
      --dur-fast: 180ms;
      --dur-base: 260ms;
      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      /* Typography */
      --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-ui);
      color: var(--text);
      background: #000000;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .page-content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 40px;
    }

    /* Hero */
    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn var(--dur-base) 0.08s var(--ease-out) both;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: var(--r-full);
      background: rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .hero-eyebrow .dot {
     width: 6px;
     height: 6px;
     border-radius: 50%;
     background: #3b82f6;
     animation: pulse 2.4s var(--ease-out) infinite;
   }

    .hero-time {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .hero-date {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* Search */
    .search-section {
      width: min(100%, 750px);
      margin: 0 auto;
      animation: fadeIn var(--dur-base) 0.08s var(--ease-out) both;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 12px 0 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 15, 15, 0.95);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-bounce);
    }

    .search-wrap:focus-within {
     border-color: rgba(255, 255, 255, 0.4);
     box-shadow: 0 0 0 3px rgba(255,255,255,0.1), 0 12px 40px rgba(0, 0, 0, 0.6);
     transform: translateY(-2px);
     background: rgba(20, 20, 20, 0.98);
   }

   .search-icon {
     color: var(--text-tertiary);
     flex-shrink: 0;
     display: flex;
   }

   .search-input {
     flex: 1;
     border: none;
     background: transparent;
     color: var(--text-primary);
     font-size: 16px;
     font-family: var(--font-ui);
     font-weight: 400;
     outline: none;
   }

   .search-input::placeholder { color: var(--text-muted); }

   .search-btn {
     height: 38px;
     padding: 0 22px;
     border-radius: 20px;
     border: 1px solid rgba(255, 255, 255, 0.15);
     background: rgba(0,0,0,0.5);
     color: var(--text-primary);
     font-size: 14px;
     font-family: var(--font-ui);
     font-weight: 500;
     cursor: pointer;
     transition: all var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
     flex-shrink: 0;
   }

   .search-btn:hover {
     transform: translateY(-1px);
     background: rgba(0,0,0,0.8);
     border-color: rgba(255,255,255,0.4);
   }

    .search-btn:active { transform: scale(0.96); }

    /* Speed Dial */
    .dial-section {
      width: min(100%, 750px);
      margin: 0 auto;
      animation: fadeIn var(--dur-base) 0.15s var(--ease-out) both;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .dial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 700px) {
      .dial-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .dial {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(15, 15, 15, 0.9);
      color: var(--text);
      text-decoration: none;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 16px 18px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-bounce);
    }

    .dial:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(25, 25, 25, 0.95);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .dial:active { transform: scale(0.98); }

    .dial-favicon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(30, 30, 30, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .dial-favicon img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .dial strong {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      z-index: 1;
    }

    .dial span {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
      position: relative;
      z-index: 1;
    }

    /* Footer */
    .page-footer {
      position: relative;
      z-index: 1;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      animation: fadeIn var(--dur-base) 0.22s var(--ease-out) both;
      background: transparent;
    }

    .footer-hint {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      min-width: 20px;
      padding: 0 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 30, 30, 0.95);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale3d(0.85, 0.85, 1); }
      50%       { opacity: 1;   transform: scale3d(1.1, 1.1, 1); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); }
  </style>
</head>
<body>

  <div class="page-content">

    <!-- Hero: clock + greeting -->
    <header class="hero">
      <div class="hero-eyebrow">
        <div class="dot"></div>
        <span id="greeting-text">Good morning</span>
      </div>
      <div class="hero-time" id="clock">—</div>
      <div class="hero-date" id="date-display">—</div>
    </header>

    <!-- Search -->
    <section class="search-section">
      <form class="search-wrap" id="search-form" autocomplete="off">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11.5 11.5l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="Search the web or enter an address…"
          autocomplete="off"
          autofocus
        />
        <button class="search-btn" type="submit">Search</button>
      </form>
    </section>

    <!-- Speed Dial -->
    <section class="dial-section">
      <div class="section-label">Quick access</div>
      <div class="dial-grid" id="dial-grid">

        <a class="dial" href="https://youtube.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>YouTube</strong>
          <span>youtube.com</span>
        </a>

        <a class="dial" href="https://github.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>GitHub</strong>
          <span>github.com</span>
        </a>

        <a class="dial" href="https://search.brave.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=search.brave.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>Brave Search</strong>
          <span>search.brave.com</span>
        </a>

        <a class="dial" href="https://mail.google.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=mail.google.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>Gmail</strong>
          <span>mail.google.com</span>
        </a>

        <a class="dial" href="https://x.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=x.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>X</strong>
          <span>x.com</span>
        </a>

        <a class="dial" href="https://reddit.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>Reddit</strong>
          <span>reddit.com</span>
        </a>

        <a class="dial" href="https://stackoverflow.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=stackoverflow.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>Stack Overflow</strong>
          <span>stackoverflow.com</span>
        </a>

        <a class="dial" href="https://news.ycombinator.com">
          <div class="dial-favicon">
            <img src="https://www.google.com/s2/favicons?domain=news.ycombinator.com&sz=32" alt="" loading="lazy" />
          </div>
          <strong>Hacker News</strong>
          <span>news.ycombinator.com</span>
        </a>

      </div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="page-footer">
    <div class="footer-hint">
      Type <kbd class="kbd">home</kbd> in the address bar to return here · <kbd class="kbd">⌘K</kbd> for commands
    </div>
  </footer>

  <script>
    // Clock & greeting
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date-display');
    const greetEl = document.getElementById('greeting-text');

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const hr = h % 12 || 12;
      const ampm = h < 12 ? 'AM' : 'PM';
      clockEl.textContent = `${hr}:${m} ${ampm}`;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

      if (h < 5)       greetEl.textContent = 'Good night';
      else if (h < 12) greetEl.textContent = 'Good morning';
      else if (h < 17) greetEl.textContent = 'Good afternoon';
      else if (h < 21) greetEl.textContent = 'Good evening';
      else             greetEl.textContent = 'Good night';
    }

    updateClock();
    setInterval(updateClock, 5000);

    // Search form
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = input.value.trim();
      if (!raw) return;
      const hasProtocol = /^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(raw);
      const isDomainLike = /^[^\s]+\.[^\s]{2,}$/.test(raw) && !raw.includes(' ');
      const target = hasProtocol
        ? raw
        : isDomainLike
          ? `https://${raw}`
          : `https://search.brave.com/search?q=${encodeURIComponent(raw)}`;
      window.location.assign(target);
    });

    // Favicon error fallback
    document.querySelectorAll('.dial-favicon img').forEach(img => {
      img.onerror = () => {
        img.style.display = 'none';
        img.parentElement.textContent = img.closest('.dial').querySelector('strong').textContent[0];
      };
    });
  </script>

</body>
</html>
