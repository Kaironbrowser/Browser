<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairon — Home</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      /* Backgrounds */
      --bg: #000000;
      --surface-1: #050505;
      --surface-2: #0A0A0A;
      --surface-3: #111111;
      --surface-4: #1A1A1A;
      /* Borders & Highlights */
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.10);
      --highlight: rgba(255,255,255,0.06);
      --shadow-highlight: inset 0 1px 0 rgba(255,255,255,0.06);
      /* Text */
      --text: #eef0f8;
      --text-secondary: #8b93b5;
      --text-tertiary: #555e80;
      --text-muted: #555e80;
      /* Accent */
     --accent: #000000;
     --accent-soft: rgba(0,0,0,0.12);
     --accent-faint: rgba(0,0,0,0.06);
      /* Theme-aware chrome tokens (dark defaults — exact current values) */
      --text-primary: #eef0f8;
      --eyebrow-bg: rgba(0, 0, 0, 0.08);
      --eyebrow-border: rgba(255, 255, 255, 0.15);
      --eyebrow-text: #FFFFFF;
      --dot-color: #3b82f6;
      --search-border: rgba(255, 255, 255, 0.12);
      --search-border-focus: rgba(255, 255, 255, 0.4);
      --search-bg: rgba(15, 15, 15, 0.95);
      --search-bg-focus: rgba(20, 20, 20, 0.98);
      --search-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --search-shadow-focus: 0 0 0 3px rgba(255,255,255,0.1), 0 12px 40px rgba(0, 0, 0, 0.6);
      --btn-border: rgba(255, 255, 255, 0.15);
      --btn-border-hover: rgba(255,255,255,0.4);
      --btn-bg: rgba(0,0,0,0.5);
      --btn-bg-hover: rgba(0,0,0,0.8);
      --dial-border: rgba(255, 255, 255, 0.08);
      --dial-border-hover: rgba(255, 255, 255, 0.15);
      --dial-bg: rgba(15, 15, 15, 0.9);
      --dial-bg-hover: rgba(25, 25, 25, 0.95);
      --dial-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --dial-shadow-hover: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.4);
      --favicon-bg: rgba(30, 30, 30, 0.95);
      --favicon-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      --footer-border: rgba(255, 255, 255, 0.04);
      --kbd-border: rgba(255, 255, 255, 0.1);
      --kbd-bg: rgba(30, 30, 30, 0.95);
      /* Spacing */
      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 20px;
      /* Radius */
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 10px;
      --r-full: 9999px;
      /* Shadows */
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.85);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.95);
      --shadow-lg: 0 8px 48px rgba(0,0,0,1);
      --shadow-focus: 0 0 0 2px var(--accent);
      /* Motion */
      --dur-fast: 180ms;
      --dur-base: 260ms;
      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      /* Typography */
      --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
    }

    /* ── LIGHT THEME ────────────────────────────────────────
       Monochrome light palette — the same Kairon design translated to
       off-white surfaces with dark ink text. Applied via data-theme on
       <html> (set before first paint from the ?theme= query and live-synced
       from the FeatureStore). */
    :root[data-theme='light'] {
      color-scheme: light;
      --bg: #f0f0f0;
      --surface-1: #fafafa;
      --surface-2: #ffffff;
      --surface-3: #f5f5f5;
      --surface-4: #e8e8e8;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --highlight: rgba(0, 0, 0, 0.05);
      --shadow-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --text: #141414;
      --text-secondary: #555555;
      --text-tertiary: #777777;
      --text-muted: #777777;
      --accent: #1a1a1a;
      --accent-soft: rgba(0, 0, 0, 0.10);
      --accent-faint: rgba(0, 0, 0, 0.05);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.12);
      --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.14);
      --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.16);
      --text-primary: #141414;
      --eyebrow-bg: rgba(0, 0, 0, 0.05);
      --eyebrow-border: rgba(0, 0, 0, 0.15);
      --eyebrow-text: #1a1a1a;
      --dot-color: #1a1a1a;
      --search-border: rgba(0, 0, 0, 0.14);
      --search-border-focus: rgba(0, 0, 0, 0.45);
      --search-bg: rgba(255, 255, 255, 0.92);
      --search-bg-focus: rgba(255, 255, 255, 0.98);
      --search-shadow: 0 8px 32px rgba(0, 0, 0, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      --search-shadow-focus: 0 0 0 3px rgba(0, 0, 0, 0.08), 0 12px 40px rgba(0, 0, 0, 0.12);
      --btn-border: rgba(0, 0, 0, 0.18);
      --btn-border-hover: rgba(0, 0, 0, 0.45);
      --btn-bg: rgba(0, 0, 0, 0.06);
      --btn-bg-hover: rgba(0, 0, 0, 0.10);
      --dial-border: rgba(0, 0, 0, 0.09);
      --dial-border-hover: rgba(0, 0, 0, 0.18);
      --dial-bg: rgba(255, 255, 255, 0.9);
      --dial-bg-hover: #ffffff;
      --dial-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --dial-shadow-hover: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 8px 24px rgba(0, 0, 0, 0.10);
      --favicon-bg: #f0f0f0;
      --favicon-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --footer-border: rgba(0, 0, 0, 0.06);
      --kbd-border: rgba(0, 0, 0, 0.14);
      --kbd-bg: #f5f5f5;
    }

    /* Theme flip: animate theme-dependent properties so Light↔Dark switches
       feel smooth instead of snapping. The flip class drops ~300ms after the
       switch, which also snaps any transition Chromium froze in a hidden or
       occluded window to the new theme values (no stale colors). */
    :root.theme-switching, :root.theme-switching *, :root.theme-switching *::before, :root.theme-switching *::after {
      transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, outline-color 220ms ease, box-shadow 220ms ease, fill 220ms ease, stroke 220ms ease !important;
      animation: none !important;
    }

    /* Internal-page navigation entrance (?transition=1 set by main when this
       page replaces another Kairon internal page): fades in with a slight
       rise. The hidden state applies before first paint; a double-rAF releases
       it. First loads render instantly — no class, no animation. Element-level
       entrance animations are suppressed during the entrance so nothing plays
       twice. */
    html { transition: opacity 150ms ease-out, transform 150ms ease-out; }
    html.page-enter { opacity: 0.45; transform: translateY(5px); }
    html.page-enter * { animation: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-ui);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .page-content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 40px;
    }

    /* Hero */
    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn var(--dur-base) 0.08s var(--ease-out) both;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--eyebrow-text);
      padding: 6px 14px;
      border-radius: var(--r-full);
      background: var(--eyebrow-bg);
      border: 1px solid var(--eyebrow-border);
    }

    .hero-eyebrow .dot {
     width: 6px;
     height: 6px;
     border-radius: 50%;
     background: var(--dot-color);
     animation: pulse 2.4s var(--ease-out) infinite;
   }

    .hero-time {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .hero-date {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* Search */
    .search-section {
      width: min(100%, 750px);
      margin: 0 auto;
      animation: fadeIn var(--dur-base) 0.08s var(--ease-out) both;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 12px 0 18px;
      border-radius: 24px;
      border: 1px solid var(--search-border);
      background: var(--search-bg);
      box-shadow: var(--search-shadow);
      transition: all var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-bounce);
    }

    .search-wrap:focus-within {
     border-color: var(--search-border-focus);
     box-shadow: var(--search-shadow-focus);
     transform: translateY(-2px);
     background: var(--search-bg-focus);
   }

   .search-icon {
     color: var(--text-tertiary);
     flex-shrink: 0;
     display: flex;
   }

   .search-input {
     flex: 1;
     border: none;
     background: transparent;
     color: var(--text-primary);
     font-size: 16px;
     font-family: var(--font-ui);
     font-weight: 400;
     outline: none;
   }

   .search-input::placeholder { color: var(--text-muted); }

   .search-btn {
     height: 38px;
     padding: 0 22px;
     border-radius: 20px;
     border: 1px solid var(--btn-border);
     background: var(--btn-bg);
     color: var(--text-primary);
     font-size: 14px;
     font-family: var(--font-ui);
     font-weight: 500;
     cursor: pointer;
     transition: all var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
     flex-shrink: 0;
   }

   .search-btn:hover {
     transform: translateY(-1px);
     background: var(--btn-bg-hover);
     border-color: var(--btn-border-hover);
   }

    .search-btn:active { transform: scale(0.96); }

    /* Speed Dial */
    .dial-section {
      width: min(100%, 750px);
      margin: 0 auto;
      animation: fadeIn var(--dur-base) 0.15s var(--ease-out) both;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .dial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 700px) {
      .dial-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .dial {
      position: relative;
      border: 1px solid var(--dial-border);
      border-radius: 16px;
      background: var(--dial-bg);
      color: var(--text);
      text-decoration: none;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 16px 18px;
      overflow: hidden;
      box-shadow: var(--dial-shadow);
      transition: all var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-bounce);
    }

    .dial:hover {
      border-color: var(--dial-border-hover);
      background: var(--dial-bg-hover);
      transform: translateY(-2px);
      box-shadow: var(--dial-shadow-hover);
    }

    .dial:active { transform: scale(0.98); }

    .dial-favicon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: var(--favicon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      box-shadow: var(--favicon-shadow);
    }

    .dial-favicon img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .dial strong {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
      z-index: 1;
    }

    .dial span {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
      position: relative;
      z-index: 1;
    }

    /* Footer */
    .page-footer {
      position: relative;
      z-index: 1;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--footer-border);
      animation: fadeIn var(--dur-base) 0.22s var(--ease-out) both;
      background: transparent;
    }

    .footer-hint {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      min-width: 20px;
      padding: 0 6px;
      border-radius: 6px;
      border: 1px solid var(--kbd-border);
      background: var(--kbd-bg);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale3d(0.85, 0.85, 1); }
      50%       { opacity: 1;   transform: scale3d(1.1, 1.1, 1); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); }
  </style>
</head>
<body>
<script>
  // Apply the persisted theme before first paint: the main process passes the
  // current FeatureStore value as ?theme= when loading this page. Live changes
  // arrive via settings-updated (see the sync script at the end of the body).
  try {
    document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
  } catch (e) {}
</script>
<script>
  // Internal-page navigation entrance: main adds ?transition=1 when this page
  // replaces another Kairon internal page. The hidden state is applied before
  // first paint (no flash), then a double-rAF releases the fade/rise so the
  // transition starts from the painted frame. First loads have no
  // ?transition= and render instantly.
  (function () {
    try {
      if (new URLSearchParams(location.search).get('transition') !== '1') return;
      var root = document.documentElement;
      var released = false;
      function release() {
        if (released) return;
        released = true;
        root.classList.remove('page-enter');
      }
      root.classList.add('page-enter');
      requestAnimationFrame(function () {
        requestAnimationFrame(release);
      });
      // Safety net: if rAF is throttled (e.g. the window is occluded right
      // after navigation) never leave the page stuck at the 45% start state.
      setTimeout(release, 350);
    } catch (e) {}
  })();
</script>

  <div class="page-content">

    <!-- Hero: clock + greeting -->
    <header class="hero">
      <div class="hero-eyebrow">
        <div class="dot"></div>
        <span id="greeting-text">Good morning</span>
      </div>
      <div class="hero-time" id="clock">—</div>
      <div class="hero-date" id="date-display">—</div>
    </header>

    <!-- Search -->
    <section class="search-section">
      <form class="search-wrap" id="search-form" autocomplete="off">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11.5 11.5l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="Search the web or enter an address…"
          autocomplete="off"
          autofocus
        />
        <button class="search-btn" type="submit">Search</button>
      </form>
    </section>

    <!-- Speed Dial / Quick Access — rendered from the persistent Quick Access
         store (see the script at the end of the body). The section hides
         itself when the store is empty. -->
    <section class="dial-section" id="dial-section">
      <div class="section-label">Quick access</div>
      <div class="dial-grid" id="dial-grid"></div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="page-footer">
    <div class="footer-hint">
      Type <kbd class="kbd">home</kbd> in the address bar to return here · <kbd class="kbd">⌘K</kbd> for commands
    </div>
  </footer>

  <script>
    // Clock & greeting
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date-display');
    const greetEl = document.getElementById('greeting-text');

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const hr = h % 12 || 12;
      const ampm = h < 12 ? 'AM' : 'PM';
      clockEl.textContent = `${hr}:${m} ${ampm}`;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

      if (h < 5)       greetEl.textContent = 'Good night';
      else if (h < 12) greetEl.textContent = 'Good morning';
      else if (h < 17) greetEl.textContent = 'Good afternoon';
      else if (h < 21) greetEl.textContent = 'Good evening';
      else             greetEl.textContent = 'Good night';
    }

    updateClock();
    setInterval(updateClock, 5000);

    // Search form
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = input.value.trim();
      if (!raw) return;
      const hasProtocol = /^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(raw);
      const isDomainLike = /^[^\s]+\.[^\s]{2,}$/.test(raw) && !raw.includes(' ');
      const target = hasProtocol
        ? raw
        : isDomainLike
          ? `https://${raw}`
          : `https://search.brave.com/search?q=${encodeURIComponent(raw)}`;
      window.location.assign(target);
    });

    // ── QUICK ACCESS (speed dial) ─────────────────────────────
    // The dial grid renders from the persistent Quick Access store in the main
    // process (electron-store backed — the same list the chrome's star popup
    // maintains). Live updates arrive via quick-access-updated pushes, so
    // adding/removing from the star popdown reflects here instantly, no
    // restart or manual refresh needed. When this page is opened outside the
    // app (no preload API), the historical default dials render statically
    // instead so the page still looks right.
    (function () {
      const grid = document.getElementById('dial-grid');
      const section = document.getElementById('dial-section');
      if (!grid) return;

      const DEFAULT_DIALS = [
        { title: 'YouTube', url: 'https://youtube.com', favicon: 'https://www.google.com/s2/favicons?domain=youtube.com&sz=32' },
        { title: 'GitHub', url: 'https://github.com', favicon: 'https://www.google.com/s2/favicons?domain=github.com&sz=32' },
        { title: 'Brave Search', url: 'https://search.brave.com', favicon: 'https://www.google.com/s2/favicons?domain=search.brave.com&sz=32' },
        { title: 'Gmail', url: 'https://mail.google.com', favicon: 'https://www.google.com/s2/favicons?domain=mail.google.com&sz=32' },
        { title: 'X', url: 'https://x.com', favicon: 'https://www.google.com/s2/favicons?domain=x.com&sz=32' },
        { title: 'Reddit', url: 'https://reddit.com', favicon: 'https://www.google.com/s2/favicons?domain=reddit.com&sz=32' },
        { title: 'Stack Overflow', url: 'https://stackoverflow.com', favicon: 'https://www.google.com/s2/favicons?domain=stackoverflow.com&sz=32' },
        { title: 'Hacker News', url: 'https://news.ycombinator.com', favicon: 'https://www.google.com/s2/favicons?domain=news.ycombinator.com&sz=32' },
      ];

      function sanitizeText(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      // Favicon URL sanitizer: validates protocol and escapes HTML-special chars.
      var _SAFE_FAV_PROTOS = new Set(['http:', 'https:', 'data:']);
      function sanitizeFaviconUrl(url) {
        if (typeof url !== 'string' || !url) return '';
        try {
          var p = new URL(url);
          if (!_SAFE_FAV_PROTOS.has(p.protocol)) return '';
          if (p.protocol === 'data:' && !url.toLowerCase().startsWith('data:image/')) return '';
        } catch { return ''; }
        return url.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function buildDial(item) {
        const url = (item && item.url) || '';
        const title = (item && (item.title || item.url)) || '';
        const faviconUrl = (item && typeof item.favicon === 'string') ? item.favicon : '';
        const display = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        const img = faviconUrl
          ? '<img src="' + sanitizeFaviconUrl(faviconUrl) + '" alt="" loading="lazy" />'
          : '';
        return '<a class="dial" href="' + url.replace(/"/g, '&quot;') + '">'
          + '<div class="dial-favicon">' + img + '</div>'
          + '<strong>' + sanitizeText(title) + '</strong>'
          + '<span>' + sanitizeText(display) + '</span>'
          + '</a>';
      }

      function render(list) {
        const entries = Array.isArray(list) ? list : [];
        if (section) section.style.display = entries.length ? '' : 'none';
        grid.innerHTML = entries.map(buildDial).join('');
        // Favicon error fallback: show the first letter of the title.
        grid.querySelectorAll('.dial-favicon').forEach((el) => {
          const img = el.querySelector('img');
          const letter = () => {
            const strong = el.closest('.dial') && el.closest('.dial').querySelector('strong');
            return strong ? strong.textContent.charAt(0) : '?';
          };
          if (!img) { el.textContent = letter(); return; }
          img.onerror = () => {
            img.style.display = 'none';
            el.textContent = letter();
          };
        });
      }

      const kairon = window.kairon;
      if (kairon && typeof kairon.getQuickAccess === 'function' && typeof kairon.onQuickAccessUpdated === 'function') {
        kairon.getQuickAccess()
          .then((list) => render(list))
          .catch(() => render(DEFAULT_DIALS));
        kairon.onQuickAccessUpdated((list) => render(list));
      } else {
        render(DEFAULT_DIALS);
      }
    })();
  </script>

  <script>
    // ── GLOBAL THEME LIVE SYNC ─────────────────────────────
    // The persisted Theme Mode (FeatureStore) is the single source of truth.
    // Main re-pushes the full snapshot to every Kairon-owned internal page on
    // change; flip instantly and re-enable transitions after one frame.
    (function () {
      function applyTheme(mode) {
        var theme = mode === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        if (root.dataset.theme === theme) return;
        root.classList.add('theme-switching');
        void root.offsetHeight; // recalc so the transition rule is active before values change
        root.dataset.theme = theme;
        setTimeout(function () { root.classList.remove('theme-switching'); }, 300);
      }
      try {
        window.kairon.onSettingsUpdated(function (snapshot) {
          var mode = snapshot && snapshot.state && snapshot.state.themeSystem && snapshot.state.themeSystem.settings && snapshot.state.themeSystem.settings.mode;
          if (mode) applyTheme(mode);
        });
      } catch (e) {}
    })();
  </script>

</body>
</html>
